<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chishti Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOADER -->
<div id="loader">
  <h2>CHISHTI LIBRARY</h2>
  <p>Loading...</p>
</div>

<!-- WEBSITE -->
<div id="website">

<header class="navbar">
  <h2>📚 Chishti Library</h2>
</header>

<section class="hero">
  <h1>Digital Islamic Library</h1>
  <p>Books • PDF • Knowledge • AI Chatbot</p>
</section>

<!-- CHATBOT -->
<div id="chatButton">🤖</div>

<div id="chatBox">
  <div id="chatBody"></div>

  <div class="inputBox">
    <input id="aiInput" placeholder="Ask anything...">
    <button id="sendBtn">Send</button>
  </div>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
