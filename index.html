<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chishti Library | Digital Islamic Library</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- LOADER -->
<div id="loader">
    <div class="loader-box">
        <img src="logo.png" class="loader-logo">
        <h1>CHISHTI LIBRARY</h1>
        <p>Digital Islamic Library</p>
        <div class="loading-bar"><div class="loading"></div></div>
    </div>
</div>

<div id="website">
    <!-- HEADER -->
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo-area">
                <img src="logo.png"> <span>CHISHTI LIBRARY</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="books.html">Books</a></li>
                <li><a href="author.html">Author</a></li>
            </ul>
            <button id="themeBtn">🌙</button>
        </nav>
    </header>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <img src="logo.png" class="hero-logo">
            <h1>CHISHTI LIBRARY</h1>
            <h3>Digital Islamic Library</h3>
            <div class="hero-buttons">
                <a href="books.html" class="btn">📚 Explore Books</a>
            </div>
        </div>
    </section>

    <!-- BOOKS SECTIONS -->
    <section class="featured-section"><div class="container"><div id="featuredBooks" class="books-grid"></div></div></section>
    <section class="latest-section"><div class="container"><div id="latestBooks" class="books-grid"></div></div></section>

    <!-- CHATBOT -->
    <div id="chatButton">🤖</div>
    <div id="chatBox">
        <div class="chat-header"><div>🤖 Chishti AI</div><span id="closeChat">✕</span></div>
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-input">
            <input type="text" id="aiInput" placeholder="Ask anything...">
            <button id="sendBtn">Send</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
