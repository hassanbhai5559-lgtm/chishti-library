<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chishti Library</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<!-- ================= LOADER ================= -->
<div id="loader"></div>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">

<div class="logo">
<img src="logo.png" alt="logo">
<h2>CHISHTI LIBRARY</h2>
</div>

</nav>

<!-- ================= HERO ================= -->
<section class="hero">

<h1>Chishti Islamic Library</h1>

<p>Read & Download Islamic Books</p>

<input type="text" id="searchInput" placeholder="Search books...">

</section>

<!-- ================= CATEGORIES ================= -->
<section class="categories">

<button class="category active" onclick="filterBooks('All',this)">ALL</button>
<button class="category" onclick="filterBooks('Naat',this)">NAAT</button>
<button class="category" onclick="filterBooks('Manqabat',this)">MANQABAT</button>
<button class="category" onclick="filterBooks('Hamd',this)">HAMD</button>
<button class="category" onclick="filterBooks('Maqala',this)">MAQALA</button>

</section>

<!-- ================= BOOKS ================= -->
<section class="books-section">

<div id="booksContainer"></div>

</section>

<!-- ================= BOOK TEMPLATE ================= -->
<template id="bookTemplate">

<div class="book-card">

<img class="cover" src="">

<h3 class="title"></h3>

<p class="author"></p>

<p class="description"></p>

<span class="book-category"></span>

<div>
<span class="views"></span>
<span class="downloads"></span>
</div>

<a class="readBtn" target="_blank">Read</a>
<a class="downloadBtn" download>Download</a>

</div>

</template>

<!-- ================= AI BOT ================= -->
<button id="chatBtn">
<img src="6d587a32-1b31-4895-8a67-e5e3a64257e4.png">
</button>

<div id="chatWindow">

<div class="chat-header">
<h3>Chishti AI</h3>
<button id="closeChat">X</button>
</div>

<div id="chatMessages"></div>

<input type="text" id="userInput">
<button id="sendBtn">Send</button>

</div>

<!-- ================= SCRIPT ================= -->
<script src="script.js"></script>

</body>
</html>
