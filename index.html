<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chishti Library</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOADER -->
<div id="loader">
  <h2>Loading...</h2>
</div>

<!-- NAV -->
<nav class="navbar">
  <h2>Chishti Library</h2>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>Chishti Library</h1>
</section>

<!-- BOOKS -->
<section>
  <div id="booksContainer"></div>
</section>

<!-- CHAT BUTTON -->
<button id="chatBtn">🤖</button>

<!-- CHAT WINDOW -->
<div id="chatWindow">

  <div id="chatMessages"></div>

  <input id="userInput" type="text" placeholder="Ask...">

  <button onclick="sendMessage()">Send</button>

</div>
