<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chishti Library</title>

<link rel="stylesheet" href="style.css">
</head>

<body class="light">

<!-- LOADER -->
<div id="loader">
  <div class="loader-logo">📚 CHISHTI LIBRARY</div>
</div>

<!-- MAIN WEBSITE -->
<div id="website">

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo">📚 Chishti Library</div>

  <div class="nav-buttons">
    <button onclick="setTheme('light')">☀</button>
    <button onclick="setTheme('dark')">🌙</button>
    <button onclick="setTheme('auto')">⚡</button>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <div class="center-logo">📚</div>
    <h1>Digital Islamic Library</h1>
    <p>Books • Knowledge • PDF • AI Chatbot</p>
    <a href="#books" class="btn">Explore Books</a>
  </div>
</section>

<!-- BOOKS -->
<section id="books" class="books-section">
  <h2>📚 Featured Books</h2>

  <div class="books-grid">

    <div class="book-card">
      <img src="https://via.placeholder.com/300x400">
      <h3>Islamic History</h3>
    </div>

    <div class="book-card">
      <img src="https://via.placeholder.com/300x400">
      <h3>Quran Studies</h3>
    </div>

    <div class="book-card">
      <img src="https://via.placeholder.com/300x400">
      <h3>Hadith Collection</h3>
    </div>

  </div>
</section>

<!-- CHATBOT -->
<div id="chatButton" onclick="toggleChat()">🤖</div>

<div id="chatBox">
  <div id="chatBody"></div>

  <div class="chat-input">
    <input id="aiInput" placeholder="Ask anything...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
