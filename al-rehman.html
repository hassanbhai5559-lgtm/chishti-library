<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Books | Chishti Library</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#0d0d0d;
font-family:Poppins,sans-serif;
color:white;
margin:0;
padding:50px;
}

.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;

}

.card{

background:#1b1b1b;
border-radius:15px;
overflow:hidden;
padding:20px;
text-align:center;

}

.card img{

width:220px;
height:320px;
object-fit:cover;
border-radius:10px;

}

button{

margin-top:15px;
padding:12px 25px;
border:none;
background:#b8860b;
color:white;
border-radius:30px;
cursor:pointer;
font-size:16px;

}

button:hover{

background:#0a8d42;

}

</style>

</head>

<body>

<h1>Books</h1>

<div id="books" class="grid"></div>

<script>

fetch("books.json")

.then(r=>r.json())

.then(data=>{

let html="";

data.books.forEach(book=>{

html+=`

<div class="card">

<img src="${book.cover}">

<h2>${book.title}</h2>

<p>${book.author}</p>

<p>${book.description}</p>

<button onclick="window.open('${book.pdf}','_blank')">

Read Online

</button>

<br>

<a href="${book.pdf}" download>

<button>

Download

</button>

</a>

</div>

`;

});

document.getElementById("books").innerHTML=html;

});

</script>

</body>

</html>
