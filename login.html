<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Chishti Library</title>

    <link rel="icon" type="image/png" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Poppins, sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #210000,
                    #570000,
                    #160000
                );
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: #fff;
            border-radius: 25px;
            padding: 35px 30px;
            box-shadow: 0 25px 70px rgba(0,0,0,.35);
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        h1 {
            color: #2b0000;
            font-size: 28px;
            margin-bottom: 7px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #2b0000;
        }

        .main-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 12px;
            background: #2b0000;
            color: white;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
        }

        .main-btn:hover {
            background: #4b0000;
        }

        .main-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
            color: #999;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .google-btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: white;
            color: #333;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .google-btn:hover {
            background: #f7f7f7;
        }

        .google-btn span {
            margin-right: 8px;
            font-weight: 800;
        }

        .switch-text {
            margin-top: 22px;
            font-size: 14px;
            color: #777;
        }

        .switch-text button {
            border: none;
            background: none;
            color: #2b0000;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .message {
            display: none;
            padding: 11px 13px;
            border-radius: 10px;
            margin-bottom: 17px;
            font-size: 13px;
            text-align: left;
        }

        .message.success {
            display: block;
            background: #eaf8ef;
            color: #17753b;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #b00000;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 15px;
            border: none;
            background: none;
            color: #2b0000;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        .terms {
            margin-top: 20px;
            color: #999;
            font-size: 11px;
            line-height: 1.6;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="login-box">

    <img
        src="logo.png"
        alt="Chishti Library"
        class="logo"
        onerror="this.style.display='none'"
    >

    <h1 id="formTitle">Welcome Back</h1>

    <p class="subtitle" id="formSubtitle">
        Login to your Chishti Library account
    </p>

    <div id="message" class="message"></div>


    <!-- EMAIL LOGIN -->

    <form id="loginForm">

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            type="button"
            class="forgot"
            id="forgotPasswordBtn"
        >
            Forgot password?
        </button>


        <button
            type="submit"
            class="main-btn"
            id="submitBtn"
        >
            Login
        </button>

    </form>


    <div class="divider">
        OR
    </div>


    <!-- GOOGLE LOGIN -->

    <button
        type="button"
        class="google-btn"
        id="googleBtn"
    >
        <span>G</span>
        Continue with Google
    </button>


    <!-- SWITCH LOGIN / SIGNUP -->

    <p class="switch-text">

        <span id="switchQuestion">
            Don't have an account?
        </span>

        <button
            type="button"
            id="switchBtn"
        >
            Create account
        </button>

    </p>


    <p class="terms">
        By continuing, you agree to use Chishti Library
        responsibly.
    </p>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script src="login.js"></script>

</body>
</html>
