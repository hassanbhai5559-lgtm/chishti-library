<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login — Chishti Library</title>

    <meta name="description"
          content="Login to Chishti Library">

    <link rel="icon"
          type="image/png"
          href="./logo.png">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="./login.css">

</head>


<body>

<div class="login-page">

    <div class="login-background"></div>

    <div class="login-container">

        <a href="./index.html"
           class="back-home">

            <i class="fas fa-arrow-left"></i>

            Back to Library

        </a>


        <div class="login-card">

            <div class="login-logo">

                <img
                    src="./logo.png"
                    alt="Chishti Library">

            </div>


            <h1>
                CHISHTI LIBRARY
            </h1>


            <h2>
                Welcome Back
            </h2>


            <p class="login-description">
                Login to like books, comment, share
                and keep your library activity connected.
            </p>


            <!-- USER ALREADY LOGGED IN -->

            <div
                id="loggedInBox"
                class="logged-in-box"
                style="display:none;">

                <div class="user-avatar">

                    <i class="fas fa-user"></i>

                </div>


                <h3>
                    You are already logged in
                </h3>


                <p id="currentUserEmail">
                    user@example.com
                </p>


                <button
                    id="continueButton"
                    class="main-button"
                    type="button">

                    <i class="fas fa-book-open"></i>

                    Continue to Library

                </button>


                <button
                    id="logoutButton"
                    class="logout-button"
                    type="button">

                    <i class="fas fa-right-from-bracket"></i>

                    Logout

                </button>

            </div>


            <!-- LOGIN FORM -->

            <div id="loginBox">

                <form id="loginForm">

                    <div class="input-group">

                        <label for="email">

                            Email Address

                        </label>


                        <div class="input-wrapper">

                            <i class="fas fa-envelope"></i>

                            <input
                                id="email"
                                type="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required>

                        </div>

                    </div>


                    <div class="input-group">

                        <label for="password">

                            Password

                        </label>


                        <div class="input-wrapper">

                            <i class="fas fa-lock"></i>

                            <input
                                id="password"
                                type="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required>


                            <button
                                id="showPassword"
                                class="password-button"
                                type="button"
                                aria-label="Show password">

                                <i class="fas fa-eye"></i>

                            </button>

                        </div>

                    </div>


                    <div
                        id="loginError"
                        class="message error"
                        style="display:none;">

                    </div>


                    <button
                        id="loginButton"
                        class="main-button"
                        type="submit">

                        <i class="fas fa-right-to-bracket"></i>

                        <span>
                            Login
                        </span>

                    </button>

                </form>


                <div class="divider">

                    <span>
                        OR
                    </span>

                </div>


                <button
                    id="googleButton"
                    class="google-button"
                    type="button">

                    <i class="fab fa-google"></i>

                    Continue with Google

                </button>


                <p class="signup-text">

                    Don't have an account?

                    <a href="./signup.html">
                        Create Account
                    </a>

                </p>

            </div>


            <!-- SUCCESS -->

            <div
                id="successMessage"
                class="message success"
                style="display:none;">

                <i class="fas fa-circle-check"></i>

                <span>
                    Login successful!
                </span>

            </div>

        </div>


        <p class="copyright">

            © <span id="year"></span>
            Chishti Library

        </p>

    </div>

</div>


<!-- FIREBASE -->

<script
    src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
</script>

<script
    src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js">
</script>

<script
    src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js">
</script>


<!-- YOUR FIREBASE CONFIG -->

<script src="./firebase.js"></script>


<!-- LOGIN SYSTEM -->

<script src="./login.js"></script>


</body>

</html>
