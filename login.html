<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login — Chishti Library</title>

    <meta name="description"
          content="Login to Chishti Library">

    <link rel="icon"
          type="image/png"
          href="./logo.png">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Firebase COMPAT -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

    <!-- Your Firebase -->
    <script src="./firebase.js"></script>

    <!-- Login CSS -->
    <link rel="stylesheet"
          href="./login.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <!-- Logo -->
            <div class="logo-box">

                <img src="./logo.png"
                     alt="Chishti Library Logo">

            </div>


            <!-- Heading -->
            <h1>
                Welcome Back
            </h1>

            <p class="subtitle">
                Login to Chishti Library
            </p>


            <!-- Message -->
            <div id="message"
                 class="message">
            </div>


            <!-- Login Form -->
            <form id="loginForm">

                <!-- Email -->
                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- Forgot Password -->
                <div class="forgot-row">

                    <button
                        type="button"
                        id="forgotPassword"
                        class="forgot-button">

                        Forgot Password?

                    </button>

                </div>


                <!-- Login -->
                <button
                    type="submit"
                    id="loginButton"
                    class="login-button">

                    <span id="loginButtonText">
                        Login
                    </span>

                </button>

            </form>


            <!-- Divider -->
            <div class="divider">

                <span>OR</span>

            </div>


            <!-- Google -->
            <button
                type="button"
                id="googleButton"
                class="google-button">

                <i class="fa-brands fa-google"></i>

                <span>
                    Continue with Google
                </span>

            </button>


            <!-- Signup -->
            <p class="signup-text">

                Don't have an account?

                <button
                    type="button"
                    id="signupButton"
                    class="signup-button">

                    Create Account

                </button>

            </p>


            <!-- Continue without login -->
            <button
                type="button"
                id="continueButton"
                class="continue-button">

                Continue as Guest

            </button>


            <!-- Footer -->
            <div class="login-footer">

                <span>
                    © Chishti Library
                </span>

            </div>

        </div>

    </main>


    <!-- Login JS -->
    <script src="./login.js"></script>

</body>
</html>
