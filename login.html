<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Chishti Library</title>

    <link rel="icon" type="image/png" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Poppins", sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #210000,
                    #570000,
                    #160000
                );
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 25px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
        }

        .logo {
            width: 95px;
            height: 95px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        h1 {
            color: #2b0000;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .google-btn {
            width: 100%;
            min-height: 52px;
            border: 1px solid #ddd;
            background: #fff;
            color: #222;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            font-family: "Poppins", sans-serif;
            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
            transition: 0.2s ease;
        }

        .google-btn:hover {
            background: #f7f7f7;
            border-color: #bbb;
            transform: translateY(-1px);
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #aaa;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e5e5e5;
        }

        .guest-btn {
            width: 100%;
            min-height: 50px;
            border: none;
            background: #2b0000;
            color: white;
            border-radius: 12px;

            font-family: "Poppins", sans-serif;
            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
            transition: 0.2s ease;
        }

        .guest-btn:hover {
            background: #4b0000;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 13px;
            text-align: left;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #b00000;
        }

        .message.success {
            display: block;
            background: #eaf9ef;
            color: #16803c;
        }

        .loading {
            display: none;
            margin-top: 15px;
            color: #666;
            font-size: 13px;
        }

        .loading i {
            margin-right: 6px;
        }

        .footer-text {
            margin-top: 25px;
            color: #999;
            font-size: 11px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 22px;
                border-radius: 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-wrapper">

        <div class="login-card">

            <img
                src="logo.png"
                alt="Chishti Library"
                class="logo"
            >

            <h1>Welcome to Chishti Library</h1>

            <p class="subtitle">
                Sign in to continue to your account
            </p>

            <button
                type="button"
                class="google-btn"
                id="googleLoginBtn"
            >
                <img
                    class="google-icon"
                    src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                    alt="Google"
                >

                <span>Continue with Google</span>
            </button>

            <div class="divider">
                OR
            </div>

            <button
                type="button"
                class="guest-btn"
                id="guestBtn"
            >
                <i class="fas fa-book-open"></i>
                Continue as Guest
            </button>

            <div
                id="message"
                class="message">
            </div>

            <div
                id="loading"
                class="loading">

                <i class="fas fa-spinner fa-spin"></i>
                Signing in...

            </div>

            <p class="footer-text">
                Chishti Library
            </p>

        </div>

    </div>


    <!-- Firebase -->

    <script type="module" src="login.js"></script>

</body>

</html>
