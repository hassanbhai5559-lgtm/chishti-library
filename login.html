<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Chishti Library</title>

    <link
        rel="icon"
        type="image/png"
        href="logo.png"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family: Poppins, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #210000,
                    #570000,
                    #160000
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .login-page {

            width: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .login-box {

            width: 100%;

            max-width: 430px;

            background: #ffffff;

            border-radius: 25px;

            padding: 35px 30px;

            box-shadow:
                0 25px 70px
                rgba(0,0,0,.35);

            text-align: center;

        }


        .logo {

            width: 90px;

            height: 90px;

            object-fit: contain;

            margin-bottom: 12px;

        }


        h1 {

            color: #2b0000;

            font-size: 28px;

            margin-bottom: 5px;

        }


        .subtitle {

            color: #777;

            font-size: 14px;

            margin-bottom: 25px;

        }


        .input-group {

            text-align: left;

            margin-bottom: 17px;

        }


        .input-group label {

            display: block;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 7px;

            color: #333;

        }


        .input-box {

            position: relative;

        }


        .input-box i {

            position: absolute;

            left: 14px;

            top: 50%;

            transform: translateY(-50%);

            color: #777;

        }


        .input-box input {

            width: 100%;

            padding: 13px 42px;

            border: 1px solid #ddd;

            border-radius: 12px;

            outline: none;

            font-family: inherit;

            font-size: 14px;

            transition: .2s;

        }


        .input-box input:focus {

            border-color: #2b0000;

            box-shadow:
                0 0 0 3px
                rgba(43,0,0,.08);

        }


        .password-toggle {

            position: absolute;

            right: 14px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #777;

            cursor: pointer;

            font-size: 15px;

        }


        .main-btn {

            width: 100%;

            border: none;

            background: #2b0000;

            color: white;

            padding: 14px;

            border-radius: 12px;

            font-family: inherit;

            font-weight: 700;

            cursor: pointer;

            transition: .2s;

            margin-top: 5px;

        }


        .main-btn:hover {

            background: #4b0000;

            transform: translateY(-1px);

        }


        .main-btn:disabled {

            opacity: .65;

            cursor: not-allowed;

            transform: none;

        }


        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 22px 0;

            color: #999;

            font-size: 12px;

        }


        .divider::before,

        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #ddd;

        }


        .google-btn {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            background: white;

            color: #333;

            border-radius: 12px;

            font-family: inherit;

            font-weight: 600;

            cursor: pointer;

            transition: .2s;

        }


        .google-btn:hover {

            background: #f7f7f7;

        }


        .google-btn i {

            margin-right: 8px;

        }


        .guest-btn {

            width: 100%;

            padding: 13px;

            border: none;

            background: #f1f1f1;

            color: #333;

            border-radius: 12px;

            font-family: inherit;

            font-weight: 600;

            cursor: pointer;

            margin-top: 10px;

            transition: .2s;

        }


        .guest-btn:hover {

            background: #e5e5e5;

        }


        .message {

            display: none;

            margin-top: 15px;

            padding: 11px 13px;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.5;

            text-align: left;

            background: #fff0f0;

        }


        .login-footer {

            margin-top: 22px;

            font-size: 12px;

            color: #888;

        }


        .login-footer a {

            color: #2b0000;

            text-decoration: none;

            font-weight: 600;

        }


        .security-note {

            margin-top: 15px;

            font-size: 11px;

            color: #999;

        }


        @media(max-width:480px) {

            body {

                padding: 12px;

            }


            .login-box {

                padding: 30px 20px;

                border-radius: 20px;

            }


            h1 {

                font-size: 24px;

            }

        }

    </style>

</head>


<body>


<div
    class="login-page"
    id="loginPage"
>

    <div class="login-box">


        <!-- LOGO -->

        <img
            src="logo.png"
            class="logo"
            alt="Chishti Library"
            onerror="this.style.display='none'"
        >


        <h1>
            Chishti Library
        </h1>


        <p class="subtitle">
            Sign in to continue
        </p>



        <!-- EMAIL -->

        <div class="input-group">

            <label for="loginEmail">
                Email
            </label>

            <div class="input-box">

                <i class="fas fa-envelope"></i>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

            </div>

        </div>



        <!-- PASSWORD -->

        <div class="input-group">

            <label for="loginPassword">
                Password
            </label>

            <div class="input-box">

                <i class="fas fa-lock"></i>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    class="password-toggle"
                    id="passwordToggle"
                    aria-label="Show password"
                >

                    <i class="fas fa-eye"></i>

                </button>

            </div>

        </div>



        <!-- EMAIL LOGIN -->

        <button
            type="button"
            class="main-btn"
            id="emailLoginBtn"
        >

            <i class="fas fa-right-to-bracket"></i>

            Login

        </button>



        <!-- DIVIDER -->

        <div class="divider">
            OR
        </div>



        <!-- GOOGLE LOGIN -->

        <button
            type="button"
            class="google-btn"
            id="googleLoginBtn"
        >

            <i class="fab fa-google"></i>

            Continue with Google

        </button>



        <!-- GUEST LOGIN -->

        <button
            type="button"
            class="guest-btn"
            id="guestLoginBtn"
        >

            <i class="fas fa-user"></i>

            Continue as Guest

        </button>



        <!-- MESSAGE -->

        <div
            id="loginError"
            class="message"
        ></div>



        <div class="login-footer">

            By continuing, you agree to use
            Chishti Library responsibly.

        </div>


        <div class="security-note">

            <i class="fas fa-shield-halved"></i>

            Secure authentication powered by Firebase

        </div>


    </div>

</div>



<!-- =====================================================
     FIREBASE
     IMPORTANT:
     Firebase SDK MUST COME BEFORE login.js
===================================================== -->


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>



<!-- =====================================================
     YOUR LOGIN JS
===================================================== -->

<script src="login.js"></script>



<!-- =====================================================
     PASSWORD SHOW / HIDE
===================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const password =
            document.getElementById(
                "loginPassword"
            );


        const toggle =
            document.getElementById(
                "passwordToggle"
            );


        if (
            password &&
            toggle
        ) {

            toggle.addEventListener(
                "click",
                function() {

                    const icon =
                        toggle.querySelector(
                            "i"
                        );


                    if (
                        password.type ===
                        "password"
                    ) {

                        password.type =
                            "text";


                        icon.classList.remove(
                            "fa-eye"
                        );


                        icon.classList.add(
                            "fa-eye-slash"
                        );


                    } else {

                        password.type =
                            "password";


                        icon.classList.remove(
                            "fa-eye-slash"
                        );


                        icon.classList.add(
                            "fa-eye"
                        );

                    }

                }
            );

        }

    }
);

</script>


</body>

</html>
