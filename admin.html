<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel | Chishti Library</title>

<link rel="icon" type="image/png" href="../logo.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    font-family:Poppins,sans-serif;

    background:#f4f4f4;

    color:#222;

}


/* =========================
   LOGIN
========================= */

.login-page{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
    linear-gradient(
        135deg,
        #210000,
        #570000,
        #160000
    );

}

.login-box{

    width:100%;

    max-width:430px;

    background:white;

    border-radius:25px;

    padding:40px 30px;

    text-align:center;

    box-shadow:0 25px 70px rgba(0,0,0,.35);

}

.login-logo{

    width:90px;

    height:90px;

    object-fit:contain;

    margin-bottom:15px;

}

.login-box h1{

    color:#2b0000;

    margin-bottom:8px;

}

.login-box p{

    color:#777;

    margin-bottom:25px;

}

.input-group{

    text-align:left;

    margin-bottom:18px;

}

.input-group label{

    display:block;

    margin-bottom:7px;

    font-weight:600;

}

.input-group input{

    width:100%;

    padding:13px 15px;

    border:1px solid #ddd;

    border-radius:12px;

    outline:none;

    font-family:inherit;

}

.input-group input:focus{

    border-color:#2b0000;

}

.btn{

    width:100%;

    border:none;

    padding:14px;

    border-radius:12px;

    background:#2b0000;

    color:white;

    font-family:inherit;

    font-weight:700;

    cursor:pointer;

}

.btn:hover{

    background:#4b0000;

}

.login-error{

    color:#d00000;

    margin-top:15px;

    font-size:14px;

}


/* =========================
   ADMIN
========================= */

.admin-page{

    display:none;

    min-height:100vh;

}


/* SIDEBAR */

.sidebar{

    position:fixed;

    left:0;

    top:0;

    width:250px;

    height:100vh;

    background:#2b0000;

    color:white;

    padding:25px 18px;

    z-index:100;

}

.sidebar-logo{

    text-align:center;

    padding-bottom:25px;

    border-bottom:1px solid rgba(255,255,255,.15);

}

.sidebar-logo img{

    width:70px;

    height:70px;

    object-fit:contain;

}

.sidebar-logo h2{

    font-size:18px;

    margin-top:8px;

}

.sidebar-logo span{

    font-size:12px;

    opacity:.7;

}

.sidebar-menu{

    list-style:none;

    margin-top:25px;

}

.sidebar-menu li{

    margin-bottom:8px;

}

.sidebar-menu button{

    width:100%;

    border:none;

    background:transparent;

    color:white;

    padding:13px 15px;

    border-radius:10px;

    text-align:left;

    font-family:inherit;

    cursor:pointer;

}

.sidebar-menu button:hover,

.sidebar-menu button.active{

    background:rgba(255,255,255,.12);

}

.sidebar-menu i{

    width:25px;

}


/* MAIN */

.main{

    margin-left:250px;

    min-height:100vh;

}

.topbar{

    height:75px;

    background:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 30px;

    box-shadow:0 2px 15px rgba(0,0,0,.08);

}

.topbar h2{

    color:#2b0000;

}

.logout-btn{

    border:none;

    background:#2b0000;

    color:white;

    padding:10px 18px;

    border-radius:10px;

    cursor:pointer;

    font-family:inherit;

}

.content{

    padding:30px;

}


/* DASHBOARD CARDS */

.stats{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:20px;

    margin-bottom:30px;

}

.stat-card{

    background:white;

    border-radius:18px;

    padding:25px;

    box-shadow:0 5px 25px rgba(0,0,0,.07);

}

.stat-card i{

    font-size:28px;

    color:#2b0000;

    margin-bottom:15px;

}

.stat-card h3{

    font-size:30px;

    color:#2b0000;

}

.stat-card p{

    color:#777;

}


/* BOOK FORM */

.panel{

    background:white;

    border-radius:20px;

    padding:30px;

    box-shadow:0 5px 25px rgba(0,0,0,.07);

    margin-bottom:25px;

}

.panel h2{

    color:#2b0000;

    margin-bottom:25px;

}

.form-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:20px;

}

.form-group{

    display:flex;

    flex-direction:column;

    gap:7px;

}

.form-group.full{

    grid-column:1/-1;

}

.form-group label{

    font-weight:600;

}

.form-group input,

.form-group textarea,

.form-group select{

    width:100%;

    border:1px solid #ddd;

    border-radius:10px;

    padding:12px;

    font-family:inherit;

    outline:none;

}

.form-group textarea{

    min-height:130px;

    resize:vertical;

}

.form-group input:focus,

.form-group textarea:focus,

.form-group select:focus{

    border-color:#2b0000;

}

.cover-preview{

    width:130px;

    height:170px;

    object-fit:cover;

    border-radius:10px;

    border:1px solid #ddd;

    display:none;

    margin-top:10px;

}

.form-buttons{

    display:flex;

    gap:12px;

    margin-top:20px;

}

.save-btn{

    background:#2b0000;

    color:white;

    border:none;

    padding:13px 22px;

    border-radius:10px;

    cursor:pointer;

    font-family:inherit;

    font-weight:600;

}

.clear-btn{

    background:#eee;

    color:#222;

    border:none;

    padding:13px 22px;

    border-radius:10px;

    cursor:pointer;

    font-family:inherit;

}


/* BOOK LIST */

.book-list{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:20px;

}

.book-card{

    background:#fff;

    border:1px solid #eee;

    border-radius:18px;

    overflow:hidden;

}

.book-card img{

    width:100%;

    height:230px;

    object-fit:cover;

}

.book-card-body{

    padding:18px;

}

.book-card h3{

    color:#2b0000;

    margin-bottom:6px;

}

.book-card p{

    color:#777;

    font-size:13px;

    margin-bottom:15px;

}

.book-actions{

    display:flex;

    gap:8px;

}

.book-actions button{

    flex:1;

    border:none;

    padding:9px;

    border-radius:8px;

    cursor:pointer;

    font-family:inherit;

}

.edit-btn{

    background:#2b0000;

    color:white;

}

.delete-btn{

    background:#eee;

    color:#b00000;

}


/* MESSAGE */

.message{

    padding:12px 15px;

    border-radius:10px;

    margin-bottom:20px;

    display:none;

}

.message.success{

    display:block;

    background:#e9f9ef;

    color:#16803c;

}

.message.error{

    display:block;

    background:#fff0f0;

    color:#b00000;

}


/* MOBILE */

.mobile-admin-btn{

    display:none;

}


@media(max-width:900px){

    .sidebar{

        width:220px;

    }

    .main{

        margin-left:220px;

    }

    .stats{

        grid-template-columns:1fr;

    }

    .book-list{

        grid-template-columns:
        repeat(2,1fr);

    }

}


@media(max-width:700px){

    .sidebar{

        position:relative;

        width:100%;

        height:auto;

    }

    .main{

        margin-left:0;

    }

    .form-grid{

        grid-template-columns:1fr;

    }

    .form-group.full{

        grid-column:auto;

    }

    .book-list{

        grid-template-columns:1fr;

    }

    .topbar{

        padding:0 15px;

    }

    .content{

        padding:18px;

    }

}

</style>

</head>


<body>


<!-- =========================
     LOGIN PAGE
========================= -->

<div class="login-page" id="loginPage">

    <div class="login-box">

        <img
            src="../logo.png"
            class="login-logo"
            alt="Chishti Library">

        <h1>Admin Login</h1>

        <p>
            Chishti Library Management Panel
        </p>

        <div class="input-group">

            <label>
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Admin email">

        </div>

        <div class="input-group">

            <label>
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Password">

        </div>

        <button
            class="btn"
            onclick="adminLogin()">

            <i class="fas fa-right-to-bracket"></i>

            Login

        </button>

        <div
            id="loginError"
            class="login-error">
        </div>

    </div>

</div>



<!-- =========================
     ADMIN PAGE
========================= -->

<div
    class="admin-page"
    id="adminPage">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-logo">

            <img
                src="../logo.png"
                alt="Chishti Library">

            <h2>
                CHISHTI LIBRARY
            </h2>

            <span>
                Admin Panel
            </span>

        </div>


        <ul class="sidebar-menu">

            <li>

                <button
                    class="active"
                    onclick="showSection('dashboard',this)">

                    <i class="fas fa-chart-line"></i>

                    Dashboard

                </button>

            </li>

            <li>

                <button
                    onclick="showSection('books',this)">

                    <i class="fas fa-book"></i>

                    Manage Books

                </button>

            </li>

            <li>

                <button
                    onclick="showSection('addBook',this)">

                    <i class="fas fa-plus"></i>

                    Add / Edit Book

                </button>

            </li>

            <li>

                <button
                    onclick="logout()">

                    <i class="fas fa-right-from-bracket"></i>

                    Logout

                </button>

            </li>

        </ul>

    </aside>



    <!-- MAIN -->

    <main class="main">


        <div class="topbar">

            <h2>
                Admin Dashboard
            </h2>

            <button
                class="logout-btn"
                onclick="logout()">

                Logout

            </button>

        </div>


        <div class="content">


            <!-- DASHBOARD -->

            <section
                id="dashboard"
                class="admin-section">

                <div class="stats">

                    <div class="stat-card">

                        <i class="fas fa-book"></i>

                        <h3 id="totalBooks">
                            0
                        </h3>

                        <p>
                            Total Books
                        </p>

                    </div>


                    <div class="stat-card">

                        <i class="fas fa-eye"></i>

                        <h3 id="totalVisitors">
                            0
                        </h3>

                        <p>
                            Visitors
                        </p>

                    </div>


                    <div class="stat-card">

                        <i class="fas fa-user-pen"></i>

                        <h3 id="totalAuthors">
                            0
                        </h3>

                        <p>
                            Authors
                        </p>

                    </div>

                </div>


                <div class="panel">

                    <h2>
                        Welcome to Admin Panel
                    </h2>

                    <p>
                        Yahan se aap books ka title,
                        description, author aur cover
                        manage kar sakte hain.
                    </p>

                </div>

            </section>



            <!-- BOOK LIST -->

            <section
                id="books"
                class="admin-section"
                style="display:none;">

                <div class="panel">

                    <h2>
                        Manage Books
                    </h2>

                    <div
                        id="bookMessage"
                        class="message">
                    </div>

                    <div
                        id="bookList"
                        class="book-list">

                    </div>

                </div>

            </section>



            <!-- ADD / EDIT -->

            <section
                id="addBook"
                class="admin-section"
                style="display:none;">

                <div class="panel">

                    <h2 id="formTitle">

                        Add New Book

                    </h2>


                    <div
                        id="formMessage"
                        class="message">
                    </div>


                    <form
                        id="bookForm">


                        <input
                            type="hidden"
                            id="bookId">


                        <div class="form-grid">


                            <div class="form-group">

                                <label>
                                    Book Title
                                </label>

                                <input
                                    type="text"
                                    id="bookTitle"
                                    required
                                    placeholder="Enter book title">

                            </div>


                            <div class="form-group">

                                <label>
                                    Author
                                </label>

                                <input
                                    type="text"
                                    id="bookAuthor"
                                    required
                                    placeholder="Author name">

                            </div>


                            <div class="form-group">

                                <label>
                                    Category
                                </label>

                                <select id="bookCategory">

                                    <option value="All">
                                        All
                                    </option>

                                    <option value="Naat">
                                        Naat
                                    </option>

                                    <option value="Manqabat">
                                        Manqabat
                                    </option>

                                    <option value="Hamd">
                                        Hamd
                                    </option>

                                    <option value="Maqala">
                                        Maqala
                                    </option>

                                    <option value="Kulliyat">
                                        Kulliyat
                                    </option>

                                </select>

                            </div>


                            <div class="form-group">

                                <label>
                                    Book Cover URL
                                </label>

                                <input
                                    type="text"
                                    id="bookCover"
                                    placeholder="cover.jpg">

                                <img
                                    id="coverPreview"
                                    class="cover-preview"
                                    alt="Cover Preview">

                            </div>


                            <div class="form-group full">

                                <label>
                                    Book Description
                                </label>

                                <textarea
                                    id="bookDescription"
                                    placeholder="Write book description..."
                                    required>
                                </textarea>

                            </div>


                            <div class="form-group">

                                <label>
                                    Read Book URL
                                </label>

                                <input
                                    type="text"
                                    id="bookUrl"
                                    placeholder="book.html">

                            </div>


                            <div class="form-group">

                                <label>
                                    PDF URL
                                </label>

                                <input
                                    type="text"
                                    id="bookPdf"
                                    placeholder="book.pdf">

                            </div>


                        </div>


                        <div class="form-buttons">

                            <button
                                type="submit"
                                class="save-btn">

                                <i class="fas fa-save"></i>

                                Save Book

                            </button>


                            <button
                                type="button"
                                class="clear-btn"
                                onclick="clearForm()">

                                Clear

                            </button>

                        </div>

                    </form>

                </div>

            </section>


        </div>

    </main>

</div>



<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

/* =========================================
   FIREBASE CONFIG
========================================= */

/*
   IMPORTANT:

   Yahan apni Firebase Web App ki config
   paste karni hai.

   Firebase Console:
   Project Settings
   ->
   Your apps
   ->
   Web App
*/

const firebaseConfig = {

    apiKey:
        "YOUR_API_KEY",

    authDomain:
        "YOUR_PROJECT.firebaseapp.com",

    projectId:
        "YOUR_PROJECT_ID",

    storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

    appId:
        "YOUR_APP_ID"

};


firebase.initializeApp(firebaseConfig);


const auth =
    firebase.auth();

const db =
    firebase.firestore();



/* =========================================
   LOGIN
========================================= */

function adminLogin(){

    const email =
        document.getElementById(
            "loginEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    const error =
        document.getElementById(
            "loginError"
        );


    error.innerText = "";


    auth.signInWithEmailAndPassword(
        email,
        password
    )

    .then(() => {

        showAdmin();

    })

    .catch((err) => {

        console.error(err);

        error.innerText =
            "Login failed: " +
            err.message;

    });

}



/* =========================================
   AUTH STATE
========================================= */

auth.onAuthStateChanged(
    function(user){

        if(user){

            showAdmin();

        }else{

            document
            .getElementById("loginPage")
            .style.display="flex";

            document
            .getElementById("adminPage")
            .style.display="none";

        }

    }
);



/* =========================================
   SHOW ADMIN
========================================= */

function showAdmin(){

    document
    .getElementById("loginPage")
    .style.display="none";

    document
    .getElementById("adminPage")
    .style.display="block";

    loadBooks();

}



/* =========================================
   LOGOUT
========================================= */

function logout(){

    auth.signOut();

}



/* =========================================
   SECTIONS
========================================= */

function showSection(
    sectionId,
    button
){

    document
    .querySelectorAll(".admin-section")
    .forEach(function(section){

        section.style.display="none";

    });


    document
    .getElementById(sectionId)
    .style.display="block";


    document
    .querySelectorAll(
        ".sidebar-menu button"
    )
    .forEach(function(btn){

        btn.classList.remove("active");

    });


    if(button){

        button.classList.add("active");

    }


    if(sectionId==="books"){

        loadBooks();

    }

}



/* =========================================
   LOAD BOOKS
========================================= */

async function loadBooks(){

    const list =
        document.getElementById(
            "bookList"
        );


    if(!list) return;


    list.innerHTML =
        "<p>Loading books...</p>";


    try{

        const snapshot =
            await db
            .collection("books")
            .orderBy(
                "title"
            )
            .get();


        list.innerHTML="";


        document
        .getElementById(
            "totalBooks"
        )
        .innerText =
            snapshot.size;


        if(snapshot.empty){

            list.innerHTML =
                "<p>No books found.</p>";

            return;

        }


        snapshot.forEach(
            function(doc){

                const book =
                    doc.data();


                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "book-card";


                card.innerHTML = `

                    <img
                        src="${
                            book.cover ||
                            '../logo.png'
                        }"
                        alt="${escapeHtml(
                            book.title ||
                            'Book'
                        )}"
                        onerror="this.src='../logo.png'"
                    >

                    <div class="book-card-body">

                        <h3>
                            ${
                                escapeHtml(
                                    book.title ||
                                    "Untitled"
                                )
                            }
                        </h3>

                        <p>
                            ${
                                escapeHtml(
                                    book.author ||
                                    "Unknown Author"
                                )
                            }
                        </p>

                        <div class="book-actions">

                            <button
                                class="edit-btn"
                                onclick="editBook('${doc.id}')">

                                <i class="fas fa-pen"></i>
                                Edit

                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteBook('${doc.id}')">

                                <i class="fas fa-trash"></i>
                                Delete

                            </button>

                        </div>

                    </div>

                `;


                list.appendChild(card);

            }
        );


    }catch(error){

        console.error(error);

        list.innerHTML =
            "<p>Books load nahi ho sake.</p>";

    }

}



/* =========================================
   EDIT BOOK
========================================= */

async function editBook(id){

    try{

        const doc =
            await db
            .collection("books")
            .doc(id)
            .get();


        if(!doc.exists){

            alert(
                "Book not found."
            );

            return;

        }


        const book =
            doc.data();


        document
        .getElementById("bookId")
        .value=id;


        document
        .getElementById("bookTitle")
        .value =
            book.title || "";


        document
        .getElementById("bookAuthor")
        .value =
            book.author || "";


        document
        .getElementById("bookCategory")
        .value =
            book.category || "All";


        document
        .getElementById("bookCover")
        .value =
            book.cover || "";


        document
        .getElementById(
            "bookDescription"
        )
        .value =
            book.description || "";


        document
        .getElementById("bookUrl")
        .value =
            book.url || "";


        document
        .getElementById("bookPdf")
        .value =
            book.pdf || "";


        document
        .getElementById("formTitle")
        .innerText =
            "Edit Book";


        updateCoverPreview();


        showSection(
            "addBook"
        );

    }catch(error){

        console.error(error);

        alert(
            "Book edit nahi ho saki."
        );

    }

}



/* =========================================
   SAVE BOOK
========================================= */

document
.getElementById("bookForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const id =
            document
            .getElementById(
                "bookId"
            ).value.trim();


        const data = {

            title:
                document
                .getElementById(
                    "bookTitle"
                ).value.trim(),

            author:
                document
                .getElementById(
                    "bookAuthor"
                ).value.trim(),

            category:
                document
                .getElementById(
                    "bookCategory"
                ).value,

            cover:
                document
                .getElementById(
                    "bookCover"
                ).value.trim(),

            description:
                document
                .getElementById(
                    "bookDescription"
                ).value.trim(),

            url:
                document
                .getElementById(
                    "bookUrl"
                ).value.trim(),

            pdf:
                document
                .getElementById(
                    "bookPdf"
                ).value.trim(),

            updatedAt:
                firebase.firestore.FieldValue.serverTimestamp()

        };


        const message =
            document
            .getElementById(
                "formMessage"
            );


        try{

            if(id){

                await db
                .collection("books")
                .doc(id)
                .update(data);


                showMessage(
                    message,
                    "Book successfully updated.",
                    "success"
                );

            }else{

                data.createdAt =
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp();


                await db
                .collection("books")
                .add(data);


                showMessage(
                    message,
                    "Book successfully added.",
                    "success"
                );

            }


            clearForm();

            loadBooks();


        }catch(error){

            console.error(error);

            showMessage(
                message,
                "Error: " +
                error.message,
                "error"
            );

        }

    }
);



/* =========================================
   DELETE
========================================= */

async function deleteBook(id){

    const confirmDelete =
        confirm(
            "Kya aap is book ko delete karna chahte hain?"
        );


    if(!confirmDelete){

        return;

    }


    try{

        await db
        .collection("books")
        .doc(id)
        .delete();


        loadBooks();


    }catch(error){

        console.error(error);

        alert(
            "Delete failed: " +
            error.message
        );

    }

}



/* =========================================
   CLEAR FORM
========================================= */

function clearForm(){

    document
    .getElementById(
        "bookForm"
    ).reset();


    document
    .getElementById(
        "bookId"
    ).value="";


    document
    .getElementById(
        "formTitle"
    ).innerText =
        "Add New Book";


    const preview =
        document
        .getElementById(
            "coverPreview"
        );


    preview.style.display="none";

}



/* =========================================
   COVER PREVIEW
========================================= */

document
.getElementById(
    "bookCover"
)
.addEventListener(
    "input",
    updateCoverPreview
);


function updateCoverPreview(){

    const url =
        document
        .getElementById(
            "bookCover"
        ).value.trim();


    const preview =
        document
        .getElementById(
            "coverPreview"
        );


    if(!url){

        preview.style.display="none";

        return;

    }


    preview.src=url;

    preview.style.display="block";

}



/* =========================================
   MESSAGE
========================================= */

function showMessage(
    element,
    text,
    type
){

    element.innerText=text;

    element.className =
        "message " + type;


    setTimeout(
        function(){

            element.className="message";

        },
        4000
    );

}



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(text){

    const div =
        document.createElement(
            "div"
        );

    div.textContent=text;

    return div.innerHTML;

}
