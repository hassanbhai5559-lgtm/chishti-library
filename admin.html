<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chishti Library — Admin Panel</title>

    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <!-- =========================
         LOGIN VIEW
    ========================== -->
    <div id="loginView" class="screen center">

        <div class="panel login-card">

            <img
                class="login-logo"
                src="logo.png"
                alt="Chishti Library"
            >

            <h1>CHISHTI LIBRARY</h1>

            <p class="muted">
                Secure Admin Panel
            </p>

            <form id="loginForm">

                <label>
                    Email
                    <input
                        id="email"
                        type="email"
                        autocomplete="username"
                        required
                        placeholder="Admin email"
                    >
                </label>

                <label>
                    Password
                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        required
                        placeholder="Password"
                    >
                </label>

                <button
                    type="submit"
                    class="primary wide"
                >
                    Sign In
                </button>

                <div
                    id="loginError"
                    class="error"
                ></div>

            </form>

        </div>

    </div>


    <!-- =========================
         ADMIN APP
    ========================== -->
    <div id="app" hidden>

        <!-- TOP BAR -->
        <header class="topbar">

            <div class="brand">

                <img
                    src="logo.png"
                    alt="Chishti Library Logo"
                >

                <div>
                    <b>CHISHTI LIBRARY</b>
                    <span>Admin Panel</span>
                </div>

            </div>


            <div class="top-actions">

                <span
                    id="adminEmail"
                    class="muted"
                ></span>

                <button
                    id="refreshBtn"
                    type="button"
                    class="ghost"
                >
                    ↻ Refresh
                </button>

                <button
                    id="logoutBtn"
                    type="button"
                    class="ghost danger"
                >
                    Logout
                </button>

            </div>

        </header>


        <!-- =========================
             MAIN CONTENT
        ========================== -->
        <main class="container">

            <!-- TOAST -->
            <div
                id="toast"
                class="toast"
            ></div>


            <!-- =========================
                 STATISTICS
            ========================== -->
            <section class="stats">

                <div>
                    <b id="totalBooks">0</b>
                    <span>Total Books</span>
                </div>

                <div>
                    <b id="latestBooks">0</b>
                    <span>Latest</span>
                </div>

                <div>
                    <b id="totalViews">0</b>
                    <span>Views</span>
                </div>

                <div>
                    <b id="totalLikes">0</b>
                    <span>Likes</span>
                </div>

                <div>
                    <b id="totalDownloads">0</b>
                    <span>Downloads</span>
                </div>

            </section>


            <!-- =========================
                 ADD / EDIT BOOK
            ========================== -->
            <section class="panel">

                <div class="head">

                    <div>

                        <h2 id="formTitle">
                            Add New Book
                        </h2>

                        <p class="muted">
                            Add or update books. Data is saved in Firebase.
                        </p>

                    </div>

                    <button
                        id="cancelEdit"
                        type="button"
                        class="ghost"
                        hidden
                    >
                        Cancel Edit
                    </button>

                </div>


                <!-- BOOK FORM -->
                <form
                    id="bookForm"
                    class="form-grid"
                >

                    <!-- Hidden Book ID -->
                    <input
                        id="bookId"
                        type="hidden"
                    >


                    <!-- TITLE -->
                    <label>
                        Book Title

                        <input
                            id="title"
                            type="text"
                            required
                            placeholder="Kulliyat e Saim Urdu"
                        >
                    </label>


                    <!-- AUTHOR -->
                    <label>
                        Author

                        <input
                            id="author"
                            type="text"
                            required
                            placeholder="Hazrat Allama Saim Chishti"
                        >
                    </label>


                    <!-- CATEGORY -->
                    <label>
                        Category

                        <select id="category">

                            <option>Naat</option>
                            <option>Manqabat</option>
                            <option>Hamd</option>
                            <option>Hammad</option>
                            <option>Seerat</option>
                            <option>Kulliyat</option>
                            <option>Maqala</option>
                            <option>Fiqh</option>
                            <option>Aqaid</option>
                            <option>Tareekh</option>
                            <option>Other</option>

                        </select>

                    </label>


                    <!-- DESCRIPTION -->
                    <label class="full">
                        Description

                        <textarea
                            id="description"
                            rows="4"
                            required
                            placeholder="Enter book description..."
                        ></textarea>

                    </label>


                    <!-- COVER IMAGE -->
                    <label>
                        Cover Image

                        <input
                            id="coverFile"
                            type="file"
                            accept="image/*"
                        >

                        <small id="coverInfo">
                            Choose a new file only when you want to change the cover.
                        </small>

                    </label>


                    <!-- PDF -->
                    <label>
                        PDF

                        <input
                            id="pdfFile"
                            type="file"
                            accept="application/pdf,.pdf"
                        >

                        <small id="pdfInfo">
                            Choose a new file only when you want to change the PDF.
                        </small>

                    </label>


                    <!-- LATEST -->
                    <label class="check">

                        <input
                            id="latest"
                            type="checkbox"
                        >

                        Mark as Latest Release

                    </label>


                    <!-- SAVE -->
                    <div>

                        <button
                            id="saveText"
                            type="submit"
                            class="primary"
                        >
                            Add Book
                        </button>

                        <span
                            id="status"
                            class="muted"
                        ></span>

                    </div>

                </form>

            </section>


            <!-- =========================
                 BOOKS SECTION
            ========================== -->
            <section class="panel">

                <div class="head books-head">

                    <div>

                        <h2>
                            Books
                        </h2>

                        <p class="muted">
                            Search, edit and delete library books.
                        </p>

                    </div>


                    <!-- SEARCH & FILTER -->
                    <div class="tools">

                        <input
                            id="search"
                            class="search"
                            type="search"
                            placeholder="Search title, author, category..."
                        >


                        <select id="categoryFilter">

                            <option value="">
                                All Categories
                            </option>

                            <option>Naat</option>
                            <option>Manqabat</option>
                            <option>Hamd</option>
                            <option>Hammad</option>
                            <option>Seerat</option>
                            <option>Kulliyat</option>
                            <option>Maqala</option>
                            <option>Fiqh</option>
                            <option>Aqaid</option>
                            <option>Tareekh</option>
                            <option>Other</option>

                        </select>

                    </div>

                </div>


                <!-- BOOKS WILL LOAD HERE -->
                <div
                    id="booksList"
                    class="books-list"
                ></div>

            </section>

        </main>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->
    <script
        type="module"
        src="admin.js"
    ></script>

</body>

</html>
