<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chishti Library Books</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f4f8fc;
}

header{
background:linear-gradient(135deg,#00c853,#2196f3);
color:white;
text-align:center;
padding:30px;
}

header h1{
font-size:40px;
}

.books-container{
max-width:1200px;
margin:40px auto;
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:30px;
}

.book-card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
transition:.3s;
}

.book-card:hover{
transform:translateY(-8px);
}

.book-cover{
width:100%;
height:420px;
object-fit:cover;
border-radius:10px;
margin-bottom:15px;
}

.book-card h2{
margin-bottom:10px;
color:#2196f3;
}

.book-card p{
margin:5px 0;
line-height:1.6;
}

.desc{
margin-top:10px;
color:#555;
}

.read-btn,
.download-btn{
display:block;
text-align:center;
padding:12px;
margin-top:10px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
color:white;
}

.read-btn{
background:#00c853;
}

.download-btn{
background:#2196f3;
}

footer{
background:linear-gradient(135deg,#00c853,#2196f3);
color:white;
text-align:center;
padding:20px;
margin-top:30px;
}

</style>

</head>

<body>

<header>
<h1>📚 Chishti Library Books</h1>
<p>Select a book to read online or download PDF</p>
</header>

<div id="booksContainer" class="books-container"></div>

<footer>
<p>© 2026 Chishti Library</p>
</footer>

<script>

fetch("books.json")
.then(res => res.json())
.then(data => {

const container = document.getElementById("booksContainer");

data.forEach(book => {

const div = document.createElement("div");
div.className = "book-card";

div.innerHTML = `
<img src="${book.cover}" alt="${book.title}" class="book-cover">

<h2>${book.title}</h2>

<p><b>Author:</b> ${book.author}</p>
<p><b>Language:</b> ${book.language}</p>
<p><b>Category:</b> ${book.category}</p>

<p class="desc">${book.description}</p>

<a href="${book.reader}" class="read-btn">
📖 Read Online
</a>

<a href="${book.pdf}" class="download-btn" download>
⬇ Download PDF
</a>
`;

container.appendChild(div);

});

})
.catch(err => console.log(err));

</script>

</body>
</html>
