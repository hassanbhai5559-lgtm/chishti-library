<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chishti Library Books</title>

<style>
body{
background:#f4f8fc;
font-family:Arial,sans-serif;
margin:0;
}

header{
background:linear-gradient(135deg,#0F5132,#D4AF37);
color:white;
padding:30px;
text-align:center;
}

.books{
max-width:1200px;
margin:30px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;
padding:20px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.card img{
width:100%;
height:420px;
object-fit:cover;
}

.content{
padding:20px;
}

.btn{
display:block;
text-align:center;
padding:12px;
margin-top:10px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
color:white;
}

.read{
background:#0F5132;
}

.download{
background:#D4AF37;
color:black;
}
</style>
</head>
<body>

<header>
<h1>📚 Chishti Library</h1>
<p>Read Online & Download Free Islamic Books</p>
</header>

<div class="books" id="books"></div>

<script>
fetch("books.json")
.then(response => response.json())
.then(data => {

const booksContainer = document.getElementById("books");

data.forEach(book => {

booksContainer.innerHTML += `
<div class="card">

<img src="${book.cover}" alt="${book.title}">

<div class="content">

<h2>${book.title}</h2>

<p><b>Author:</b> ${book.author}</p>
<p><b>Language:</b> ${book.language}</p>
<p><b>Category:</b> ${book.category}</p>

<a href="${book.reader}" class="btn read">
📖 Read Online
</a>

<a href="${book.pdf}" class="btn download" download>
⬇ Download PDF
</a>

</div>
</div>
`;

});

});
</script>
<script>

booksContainer.innerHTML += `

<p><b>Language:</b> ${book.language}</p>
<p><b>Category:</b> ${book.category}</p>

<a href="${book.reader}" class="btn read">
📖 Read Online
</a>

<a href="${book.pdf}" class="btn download" download>
⬇ Download PDF
</a>

</div>
</div>
`;

});

})
.catch(error => {
document.getElementById("books").innerHTML =
"<h2 style='text-align:center'>Books could not be loaded.</h2>";
console.error(error);
});
</script>

</body>
</html>
