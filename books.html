<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Books | Chishti Library</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">
        <img src="logo.png" alt="logo">
        <h2>CHISHTI LIBRARY</h2>
    </div>
</nav>

<!-- HERO -->
<section class="hero">
    <h1>Islamic Books Library</h1>

    <input type="text" id="searchInput" placeholder="Search books...">
</section>

<!-- CATEGORY -->
<div class="categories">
    <button class="category active" onclick="filterBooks('All',this)">All</button>
    <button class="category" onclick="filterBooks('Naat',this)">Naat</button>
    <button class="category" onclick="filterBooks('Manqabat',this)">Manqabat</button>
    <button class="category" onclick="filterBooks('Hamd',this)">Hamd</button>
</div>

<!-- BOOKS -->
<section id="booksContainer" class="books-grid"></section>

<!-- TEMPLATE -->
<template id="bookTemplate">
    <div class="book-card">
        <img class="cover">
        <h3 class="title"></h3>
        <p class="author"></p>
        <p class="book-category"></p>

        <a class="readBtn" target="_blank">Read</a>
        <a class="downloadBtn" download>Download</a>
    </div>
</template>

<!-- AI BUTTON -->
<button id="chatBtn">
    <img src="6d587a32-1b31-4895-8a67-e5e3a64257e4.png">
</button>

<script src="script.js"></script>

</body>
</html>
