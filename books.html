<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Books | Chishti Library</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar">

<ul class="menu">

<li><a href="index.html">Home</a></li>
<li><a href="books.html" class="active">Books</a></li>
<li><a href="#">Authors</a></li>
<li><a href="#">About</a></li>
<li><a href="#">Contact</a></li>

</ul>

<div class="mobile-menu">
<i class="fa fa-bars"></i>
</div>

</nav>

<!-- ================= HERO ================= -->

<section class="hero">

<div class="hero-content">

<span class="hero-badge">
<i class="fa fa-book"></i> Islamic Library
</span>

<h1>Explore Islamic Books</h1>

<p>Read, Download and Learn authentic Islamic knowledge</p>

<div class="search-box">

<i class="fa fa-search"></i>

<input 
type="text" 
id="searchInput" 
placeholder="Search books...">

</div>

</div>

</section>

<!-- ================= CATEGORIES ================= -->

<section class="categories-section">

<div class="container">

<div class="category-buttons">

<button class="category active" onclick="filterBooks('All', this)">All</button>
<button class="category" onclick="filterBooks('Naat', this)">Naat</button>
<button class="category" onclick="filterBooks('Manqabat', this)">Manqabat</button>
<button class="category" onclick="filterBooks('Hamd', this)">Hamd</button>
<button class="category" onclick="filterBooks('Maqala', this)">Maqala</button>

</div>

</div>

</section>

<!-- ================= BOOKS GRID ================= -->

<section class="books-section">

<div class="container">

<div id="booksContainer" class="books-grid"></div>

</div>

</section>

<!-- ================= BOOK TEMPLATE ================= -->

<template id="bookTemplate">

<div class="book-card">

<div class="book-image">

<img class="cover" src="no-image.png">

<span class="latest-tag">Latest</span>

</div>

<div class="book-content">

<h3 class="title"></h3>

<p class="author"></p>

<p class="description"></p>

<div class="book-meta">

<span class="book-category"></span>

<span><i class="fa fa-eye"></i> <span class="views"></span></span>

<span><i class="fa fa-download"></i> <span class="downloads"></span></span>

</div>

<div class="book-actions">

<a class="readBtn btn btn-primary" href="#">Read</a>
<a class="downloadBtn btn btn-outline" href="#" download>Download</a>

</div>

</div>

</div>

</template>

<!-- ================= AI BUTTON ================= -->

<button id="chatBtn" class="ai-button">

<img src="logo.png" alt="AI">

<span class="ai-pulse"></span>

</button>

<!-- ================= CHAT WINDOW ================= -->

<div id="chatWindow" class="chat-window">

<div class="chat-header">

<div class="chat-info">

<img src="logo.png">

<div>
<h3>CHISHTI AI</h3>
<p>Assistant</p>
</div>

</div>

<button id="closeChat">
<i class="fa fa-times"></i>
</button>

</div>

<div id="chatMessages" class="chat-messages">

<div class="bot-message">
<div>Assalamu Alaikum 👋 How can I help you?</div>
</div>

</div>

<div class="chat-input">

<input type="text" id="chatInput" placeholder="Ask something...">

<button id="sendMessage">
<i class="fa fa-paper-plane"></i>
</button>

</div>

</div>

<!-- ================= SCROLL TOP ================= -->

<button id="scrollTop" class="scroll-top">
<i class="fa fa-arrow-up"></i>
</button>

<!-- ================= SCRIPT ================= -->

<script src="script.js"></script>

</body>
</html>
