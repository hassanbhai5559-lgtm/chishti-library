<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ChishtiLibrary.com Digital Books"
    >

    <title>ChishtiLibrary.com — Books</title>

    <link
        rel="stylesheet"
        href="./book.css"
    >

</head>

<body>

    <main class="library">

        <header class="library-header">

            <div class="brand">
                ChishtiLibrary.com
            </div>

            <h1>
                Islamic Digital Library
            </h1>

            <p>
                Read your books online
            </p>

        </header>


        <section
            class="books"
            aria-label="Available books"
        >

            <!-- BOOK 1 -->

            <article class="book-card">

                <div class="book-cover">

                    <span>
                        BOOK
                    </span>

                    <strong>
                        Sample Islamic Book
                    </strong>

                </div>


                <div class="book-info">

                    <h2>
                        Sample Islamic Book
                    </h2>

                    <p>
                        Read this book online in
                        Chishti Reader.
                    </p>


                    <!-- IMPORTANT:
                         PDF path yahan set hoga -->

                    <a
                        class="read-button"
                        href="reader.html?book=books/sample-book.pdf"
                        aria-label="Read Sample Islamic Book"
                    >
                        Read
                    </a>

                </div>

            </article>


            <!-- BOOK 2 -->

            <article class="book-card">

                <div class="book-cover">

                    <span>
                        BOOK
                    </span>

                    <strong>
                        Another Islamic Book
                    </strong>

                </div>


                <div class="book-info">

                    <h2>
                        Another Islamic Book
                    </h2>

                    <p>
                        Open this book in the
                        digital reader.
                    </p>


                    <a
                        class="read-button"
                        href="reader.html?book=books/another-book.pdf"
                        aria-label="Read Another Islamic Book"
                    >
                        Read
                    </a>

                </div>

            </article>

        </section>

    </main>

</body>
</html>
