let firebaseBooks = {};


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================================
   FIREBASE BOOK ID
   Automatic document ID based on book ID
========================================================= */

function firebaseBookRef(book) {

    return db
        .collection("books")
        .doc(String(book.id));

}


/* =========================================================
   CREATE FIREBASE BOOK
========================================================= */

async function createFirebaseBooks() {

    try {

        const batch = db.batch();

        books.forEach(book => {

            const ref =
                firebaseBookRef(book);

            const existing =
                firebaseBooks[book.id] || {};

            batch.set(
                ref,
                {

                    bookId: book.id,

                    title: book.title,

                    author: book.author,

                    category: book.category,

                    cover: book.cover,

                    pdf: book.pdf,

                    description: book.description,

                    views:
                        Number(existing.views || 0),

                    likes:
                        Number(existing.likes || 0),

                    shares:
                        Number(existing.shares || 0),

                    comments:
                        Number(existing.comments || 0),

                    downloads:
                        Number(existing.downloads || 0),

                    createdAt:
                        existing.createdAt ||
                        firebase.firestore.FieldValue.serverTimestamp(),

                    updatedAt:
                        firebase.firestore.FieldValue.serverTimestamp()

                },

                { merge: true }
            );

        });

        await batch.commit();

        console.log(
            "✅ Firebase books synchronized"
        );

    } catch (error) {

        console.error(
            "Firebase sync error:",
            error
        );

    }

}


/* =========================================================
   LOAD FIREBASE BOOKS
========================================================= */

async function loadFirebaseBooks() {

    try {

        const snapshot =
            await db
                .collection("books")
                .get();

        firebaseBooks = {};

        snapshot.forEach(doc => {

            const data =
                doc.data();

            firebaseBooks[
                String(data.bookId)
            ] = {

                ...data,

                firebaseId:
                    doc.id

            };

        });

        await createFirebaseBooks();

        renderBooks();

    } catch (error) {

        console.error(
            "Firebase loading error:",
            error
        );

        renderBooks();

    }

}


/* =========================================================
   GET STATS
========================================================= */

function getBookStats(book) {

    const data =
        firebaseBooks[book.id] || {};

    return {

        views:
            Number(data.views || 0),

        likes:
            Number(data.likes || 0),

        shares:
            Number(data.shares || 0),

        comments:
            Number(data.comments || 0),

        downloads:
            Number(data.downloads || 0)

    };

}


/* =========================================================
   FIREBASE COUNTER
========================================================= */

async function incrementCounter(
    bookId,
    counter
) {

    try {

        const ref =
            firebaseBookRef(
                books.find(
                    book =>
                        String(book.id) ===
                        String(bookId)
                )
            );

        await ref.set(

            {

                [counter]:
                    firebase.firestore.FieldValue.increment(1),

                updatedAt:
                    firebase.firestore.FieldValue.serverTimestamp()

            },

            { merge: true }

        );


        if (!firebaseBooks[bookId]) {

            firebaseBooks[bookId] = {};

        }


        firebaseBooks[bookId][counter] =
            Number(
                firebaseBooks[bookId][counter] || 0
            ) + 1;


        renderBooks();


    } catch (error) {

        console.error(
            `Failed to update ${counter}:`,
            error
        );

    }

}


/* =========================================================
   LIKE
========================================================= */

async function likeBook(bookId) {

    await incrementCounter(
        bookId,
        "likes"
    );

}


/* =========================================================
   SHARE
========================================================= */

async function shareBook(bookId) {

    const book =
        books.find(
            item =>
                String(item.id) ===
                String(bookId)
        );

    if (!book) return;


    const url =
        window.location.origin +
        window.location.pathname +
        "?book=" +
        encodeURIComponent(book.id);


    try {

        if (
            navigator.share
        ) {

            await navigator.share({

                title:
                    book.title,

                text:
                    `${book.title} — Chishti Library`,

                url:
                    url

            });

        } else {

            await navigator.clipboard.writeText(
                url
            );

            alert(
                "Book link copied!"
            );

        }

        await incrementCounter(
            bookId,
            "shares"
        );

    } catch (error) {

        if (
            error.name !==
            "AbortError"
        ) {

            console.error(
                error
            );

        }

    }

}


/* =========================================================
   DOWNLOAD
========================================================= */

async function downloadBook(bookId) {

    const book =
        books.find(
            item =>
                String(item.id) ===
                String(bookId)
        );

    if (!book) return;


    await incrementCounter(
        bookId,
        "downloads"
    );


    const link =
        document.createElement("a");

    link.href =
        book.pdf;

    link.download =
        book.pdf;

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();

}


/* =========================================================
   COMMENT
========================================================= */

async function commentBook(bookId) {

    const text =
        prompt(
            "Apna comment likhein:"
        );


    if (
        !text ||
        !text.trim()
    ) {

        return;

    }


    try {

        await db
            .collection("books")
            .doc(String(bookId))
            .collection("comments")
            .add({

                text:
                    text.trim(),

                createdAt:
                    firebase.firestore.FieldValue.serverTimestamp()

            });


        await incrementCounter(
            bookId,
            "comments"
        );


        alert(
            "Comment added successfully!"
        );


    } catch (error) {

        console.error(
            "Comment error:",
            error
        );

    }

}


/* =========================================================
   OPEN BOOK — SAME READ BUTTON STYLE
========================================================= */

function openBook(bookId) {

    const book =
        books.find(
            item =>
                String(item.id) ===
                String(bookId)
        );


    if (!book) {

        console.error(
            "Book not found:",
            bookId
        );

        return;

    }


    const pdfFile =
        String(book.pdf || "")
            .trim();


    if (!pdfFile) {

        alert(
            "Is book ki PDF file configured nahi hai."
        );

        return;

    }


    const extension =
        pdfFile
            .split("?")[0]
            .split(".")
            .pop()
            .toLowerCase();


    if (extension !== "pdf") {

        alert(
            "Is book ki valid PDF file nahi mili."
        );

        return;

    }


    /*
     * VIEW COUNTER
     */

    incrementCounter(
        bookId,
        "views"
    );


    /*
     * EXACT SAME READER
     */

    const readerURL =
        "./reader.html?book=" +
        encodeURIComponent(
            pdfFile
        );


    window.location.href =
        readerURL;

}

/* =========================================================
   RENDER BOOKS
========================================================= */

function renderBooks() {

    const query =
        bookSearch
            ? bookSearch.value
                .trim()
                .toLowerCase()
            : "";


    let filteredBooks =
        books.filter(book => {

            const categoryMatch =
                currentCategory === "all" ||
                book.category.toLowerCase() ===
                currentCategory.toLowerCase();


            const searchText =
                (

                    book.title +
                    " " +
                    book.author +
                    " " +
                    book.category +
                    " " +
                    book.description

                ).toLowerCase();


            return (

                categoryMatch &&

                (
                    !query ||
                    searchText.includes(
                        query
                    )
                )

            );

        });


    /*
     * SORTING
     */

    if (currentSort === "oldest") {

        filteredBooks.sort(
            (a, b) =>
                Number(a.id) -
                Number(b.id)
        );

    }


    if (currentSort === "newest") {

        filteredBooks.sort(
            (a, b) =>
                Number(b.id) -
                Number(a.id)
        );

    }


    if (currentSort === "popular") {

        filteredBooks.sort(
            (a, b) => {

                const A =
                    getBookStats(a);

                const B =
                    getBookStats(b);


                const scoreA =
                    A.views +
                    (A.likes * 3) +
                    (A.shares * 4) +
                    (A.comments * 2) +
                    (A.downloads * 5);


                const scoreB =
                    B.views +
                    (B.likes * 3) +
                    (B.shares * 4) +
                    (B.comments * 2) +
                    (B.downloads * 5);


                return scoreB - scoreA;

            }
        );

    }


    booksContainer.innerHTML = "";


    if (bookCount) {

        bookCount.textContent =
            filteredBooks.length;

    }


    if (!filteredBooks.length) {

        if (emptyBooks) {

            emptyBooks.style.display =
                "block";

        }

        return;

    }


    if (emptyBooks) {

        emptyBooks.style.display =
            "none";

    }


    const fragment =
        document.createDocumentFragment();


    filteredBooks.forEach(
        book => {

            fragment.appendChild(
                createBookCard(book)
            );

        }
    );


    booksContainer.appendChild(
        fragment
    );

}


/* =========================================================
   BOOK ACTIONS
========================================================= */

booksContainer.addEventListener(
    "click",
    function(event) {

        const button =
            event.target.closest(
                "[data-action]"
            );


        if (!button) return;


        const bookId =
            button.dataset.bookId;


        const action =
            button.dataset.action;


        if (action === "read") {

            openBook(
                bookId
            );

        }


        if (action === "like") {

            likeBook(
                bookId
            );

        }


        if (action === "share") {

            shareBook(
                bookId
            );

        }


        if (action === "comment") {

            commentBook(
                bookId
            );

        }


        if (action === "download") {

            downloadBook(
                bookId
            );

        }

    }
);
