<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chishti AI</title>

    <link rel="icon"
          type="image/png"
          href="6d587a32-1b31-4895-8a67-e5e3a64257e4.png">

    <link rel="stylesheet" href="bot.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="firebase.js"></script>
</head>

<body>

<div class="ai-app">

    <!-- HEADER -->
    <header class="ai-header">

        <div class="ai-brand">

            <img
                src="6d587a32-1b31-4895-8a67-e5e3a64257e4.png"
                alt="Chishti AI">

            <div>
                <h1>CHISHTI AI</h1>
                <span>
                    <i class="fa-solid fa-circle"></i>
                    Digital Library Assistant
                </span>
            </div>

        </div>

        <div class="header-actions">

            <button id="voiceToggle"
                    class="icon-btn"
                    title="Voice answers">

                <i class="fa-solid fa-volume-high"></i>

            </button>

            <button id="clearChat"
                    class="icon-btn"
                    title="Clear chat">

                <i class="fa-solid fa-trash"></i>

            </button>

            <a href="index.html"
               class="home-btn">

                <i class="fa-solid fa-house"></i>

                Library

            </a>

        </div>

    </header>


    <!-- LOGIN CHECK -->
    <section id="loginScreen"
             class="login-screen hidden">

        <div class="login-card">

            <img
                src="6d587a32-1b31-4895-8a67-e5e3a64257e4.png"
                alt="Chishti AI">

            <h2>Login Required</h2>

            <p>
                Chishti AI is available only for
                logged-in Chishti Library users.
            </p>

            <a href="login.html"
               class="login-btn">

                <i class="fa-solid fa-right-to-bracket"></i>

                Login to Continue

            </a>

        </div>

    </section>


    <!-- LOADING -->
    <section id="loadingScreen"
             class="loading-screen">

        <div class="loader"></div>

        <p>Connecting to Chishti AI...</p>

    </section>


    <!-- MAIN CHAT -->
    <main id="chatApp"
          class="chat-app hidden">

        <div id="chatMessages"
             class="chat-messages">

        </div>


        <!-- QUICK COMMANDS -->
        <div class="quick-commands">

            <button data-command="What is Chishti Library?">
                <i class="fa-solid fa-building-columns"></i>
                Chishti Library
            </button>

            <button data-command="Show all books">
                <i class="fa-solid fa-book"></i>
                All Books
            </button>

            <button data-command="Show latest books">
                <i class="fa-solid fa-star"></i>
                Latest
            </button>

            <button data-command="Show Kulliyat books">
                <i class="fa-solid fa-book-open"></i>
                Kulliyat
            </button>

        </div>


        <!-- INPUT -->
        <div class="input-area">

            <button id="micButton"
                    class="mic-btn"
                    title="Speak">

                <i class="fa-solid fa-microphone"></i>

            </button>

            <input
                id="chatInput"
                type="text"
                autocomplete="off"
                placeholder="Ask Chishti AI...">

            <button id="sendButton"
                    class="send-btn">

                <i class="fa-solid fa-paper-plane"></i>

            </button>

        </div>

        <div id="voiceStatus"
             class="voice-status">

        </div>

        <div class="ai-footer">

            <span>
                <i class="fa-solid fa-shield-halved"></i>
                Login protected
            </span>

            <span>
                Chishti Library AI
            </span>

        </div>

    </main>

</div>

<script src="bot.js"></script>

</body>
</html>
