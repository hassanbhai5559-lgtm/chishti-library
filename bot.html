<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chishti AI | Chishti Library</title>

    <meta name="description"
          content="Chishti AI - Intelligent assistant of Chishti Library">

    <link rel="icon"
          type="image/png"
          href="./6d587a32-1b31-4895-8a67-e5e3a64257e4.png">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- CHISHTI AI CSS -->
    <link rel="stylesheet" href="./bot.css">
</head>

<body>

<!-- =====================================================
     LOADING
===================================================== -->

<div id="loadingScreen" class="screen">

    <div class="loader-box">

        <div class="jarvis-orb loading-orb">

            <div class="orb-ring ring-one"></div>
            <div class="orb-ring ring-two"></div>
            <div class="orb-ring ring-three"></div>

            <img src="./6d587a32-1b31-4895-8a67-e5e3a64257e4.png"
                 alt="Chishti AI">

        </div>

        <h2>CHISHTI AI</h2>

        <p>Initializing AI...</p>

        <div class="loading-line">
            <span></span>
        </div>

    </div>

</div>


<!-- =====================================================
     LOGIN SCREEN
===================================================== -->

<div id="loginScreen" class="screen hidden">

    <div class="login-box">

        <div class="login-logo">

            <img src="./6d587a32-1b31-4895-8a67-e5e3a64257e4.png"
                 alt="Chishti AI">

        </div>

        <h1>CHISHTI AI</h1>

        <p>
            Login required to use Chishti AI.
        </p>

        <i class="fa-solid fa-lock login-lock"></i>

        <a href="./login.html"
           class="login-button">

            <i class="fa-solid fa-right-to-bracket"></i>

            Login to Continue

        </a>

        <a href="./index.html"
           class="back-home">

            <i class="fa-solid fa-house"></i>

            Back to Library

        </a>

    </div>

</div>


<!-- =====================================================
     CHAT APP
===================================================== -->

<div id="chatApp" class="chat-app hidden">


    <!-- =================================================
         HEADER
    ================================================= -->

    <header class="chat-header">

        <div class="header-left">

            <div class="mini-orb">

                <div class="mini-ring"></div>

                <img src="./6d587a32-1b31-4895-8a67-e5e3a64257e4.png"
                     alt="Chishti AI">

            </div>

            <div>

                <h1>CHISHTI AI</h1>

                <div class="online-status">

                    <span class="online-dot"></span>

                    Online

                </div>

            </div>

        </div>


        <div class="header-actions">

            <button id="voiceToggle"
                    class="header-button"
                    title="Voice">

                <i class="fa-solid fa-volume-high"></i>

            </button>

            <button id="clearChat"
                    class="header-button"
                    title="Clear chat">

                <i class="fa-solid fa-trash"></i>

            </button>

            <a href="./index.html"
               class="header-button"
               title="Library">

                <i class="fa-solid fa-house"></i>

            </a>

        </div>

    </header>


    <!-- =================================================
         AI ORB
    ================================================= -->

    <section class="ai-area">

        <div class="jarvis-orb">

            <div class="orb-ring ring-one"></div>
            <div class="orb-ring ring-two"></div>
            <div class="orb-ring ring-three"></div>

            <div class="orb-glow"></div>

            <img src="./6d587a32-1b31-4895-8a67-e5e3a64257e4.png"
                 alt="Chishti AI Orb">

        </div>

        <h2>CHISHTI AI</h2>

        <p>
            Your Islamic Library Assistant
        </p>

    </section>


    <!-- =================================================
         QUICK COMMANDS
    ================================================= -->

    <div class="quick-commands">

        <button data-command="Hi">
            👋 Hi
        </button>

        <button data-command="What is Chishti Library?">
            📚 Library
        </button>

        <button data-command="Show all books">
            📖 Books
        </button>

        <button data-command="Show latest books">
            🆕 Latest
        </button>

        <button data-command="Show Naat books">
            🎵 Naat
        </button>

        <button data-command="Show Kulliyat books">
            📕 Kulliyat
        </button>

    </div>


    <!-- =================================================
         CHAT MESSAGES
    ================================================= -->

    <main id="chatMessages"
          class="chat-messages">

    </main>


    <!-- =================================================
         VOICE STATUS
    ================================================= -->

    <div id="voiceStatus"
         class="voice-status">
    </div>


    <!-- =================================================
         INPUT
    ================================================= -->

    <div class="input-area">

        <button id="micButton"
                class="mic-button"
                title="Speak">

            <i class="fa-solid fa-microphone"></i>

        </button>


        <input
            type="text"
            id="chatInput"
            placeholder="Ask anything..."
            autocomplete="off"
        >


        <button id="sendButton"
                class="send-button"
                title="Send">

            <i class="fa-solid fa-paper-plane"></i>

        </button>

    </div>


    <!-- =================================================
         FOOTER
    ================================================= -->

    <footer class="chat-footer">

        <span>
            <i class="fa-solid fa-shield-halved"></i>
            Login protected
        </span>

        <span>
            Chishti Library © 2026
        </span>

    </footer>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<!-- YOUR FIREBASE CONFIG -->

<script src="./firebase.js"></script>


<!-- CHISHTI AI -->

<script src="./bot.js"></script>

</body>

</html>
