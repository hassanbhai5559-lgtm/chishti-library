<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chishti AI Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

header{
background:#111827;
padding:15px;
text-align:center;
font-weight:bold;
font-size:20px;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
max-width:75%;
padding:12px;
border-radius:12px;
line-height:1.4;
animation:fade .3s ease;
}

.user{
background:#2563eb;
align-self:flex-end;
}

.bot{
background:#374151;
align-self:flex-start;
}

.inputBox{
display:flex;
padding:10px;
background:#111827;
}

input{
flex:1;
padding:12px;
border:none;
border-radius:8px;
outline:none;
background:#1f2937;
color:white;
}

button{
margin-left:10px;
padding:12px 16px;
border:none;
background:#22c55e;
color:white;
border-radius:8px;
cursor:pointer;
}

/* typing */
.typing{
display:flex;
gap:4px;
}

.dot{
width:6px;
height:6px;
background:white;
border-radius:50%;
animation:blink 1s infinite;
}

.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}

@keyframes blink{
0%,100%{opacity:.2}
50%{opacity:1}
}

@keyframes fade{
from{opacity:0;transform:translateY(10px)}
to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<header>🤖 Chishti AI Smart Library</header>

<div id="chat"></div>

<div class="inputBox">
<input id="input" placeholder="Ask anything..." onkeydown="if(event.key === 'Enter') send()">
<button onclick="send()">Send</button>
</div>

<script src="chatbot.js"></script>

</body>
</html>
