<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Husn-e-Kainat | Online Reader</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

.header{
    height:60px;
    background:linear-gradient(135deg,#00c853,#2196f3);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
}

.reader{
    height:calc(100vh - 60px);
}

.reader iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>
<body>

<div class="header">
    📖 Husn-e-Kainat
</div>

<div class="reader">
    <iframe src="husn-e-kainat.pdf"></iframe>
</div>

</body>
</html>
