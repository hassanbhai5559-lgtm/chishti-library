<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Chishti Reader</title>

<link rel="stylesheet"
href="reader.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

</head>

<body>

<!-- BACKGROUND -->

<div class="reader-background"></div>

<!-- READER -->

<div class="reader">


<!--=========================================
 CHISHTI READER TOOLBAR
 PART 1
==========================================-->

<header class="reader-toolbar">

    <!-- Left -->

    <div class="toolbar-left">

        <button id="menuBtn" class="tool-btn">
            <i class="fas fa-bars"></i>
        </button>

        <div class="reader-brand">

            <img src="logo.png" alt="Chishti">

            <div>

                <h2>CHISHTI READER</h2>

                <span>Digital Islamic Library</span>

            </div>

        </div>

    </div>

    <!-- Center -->

    <div class="toolbar-center">

        <div class="book-name">

            <i class="fas fa-book-open"></i>

            <span id="bookTitle">
                Loading...
            </span>

        </div>

    </div>

    <!-- Right -->

    <div class="toolbar-right">

        <button id="bookmarkBtn" class="tool-btn" title="Bookmark">
            <i class="fas fa-bookmark"></i>
        </button>

        <button id="searchBtn" class="tool-btn" title="Search">
            <i class="fas fa-search"></i>
        </button>

        <button id="themeBtn" class="tool-btn" title="Theme">
            <i class="fas fa-moon"></i>
        </button>

        <button id="settingBtn" class="tool-btn" title="Settings">
            <i class="fas fa-cog"></i>
        </button>

    </div>

</header>
 
 <!--=========================================
BOOK STAGE
PART 3
==========================================-->

<div class="book-stage">

    <div class="book-shadow"></div>

    <div class="book">

        <!-- Left Page -->

        <div class="page left-page">

            <canvas id="leftCanvas"></canvas>

        </div>

        <!-- Book Spine -->

        <div class="book-spine">

            <div class="spine-light"></div>

        </div>

        <!-- Right Page -->

        <div class="page right-page">

            <canvas id="rightCanvas"></canvas>

        </div>

    </div>

</div>


<!--=========================================
 CHISHTI READER
 BOTTOM TOOLBAR
 PART 3
==========================================-->

<footer class="reader-bottom">

    <button id="firstPage" class="bottom-btn">
        <i class="fas fa-backward-fast"></i>
    </button>

    <button id="prevPage" class="bottom-btn">
        <i class="fas fa-chevron-left"></i>
    </button>

    <div class="page-counter">

        <span id="pageCounter">1 - 2</span>

        <small>of</small>

        <span id="totalPages">0</span>

    </div>

    <button id="nextPage" class="bottom-btn">
        <i class="fas fa-chevron-right"></i>
    </button>

    <button id="lastPage" class="bottom-btn">
        <i class="fas fa-forward-fast"></i>
    </button>

    <div class="toolbar-divider"></div>

    <button id="zoomOut" class="bottom-btn">
        <i class="fas fa-search-minus"></i>
    </button>

    <button id="zoomIn" class="bottom-btn">
        <i class="fas fa-search-plus"></i>
    </button>

    <button id="downloadBook" class="bottom-btn">
        <i class="fas fa-download"></i>
    </button>

    <button id="printBook" class="bottom-btn">
        <i class="fas fa-print"></i>
    </button>

    <button id="fullscreen" class="bottom-btn">
        <i class="fas fa-expand"></i>
    </button>

</footer>
 
<script src="reader.js"></script>

</body>

</html>
