<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chishti Reader Pro</title>

<meta name="description" content="Chishti Library Professional Reader">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="reader.css">

</head>

<body>

<!-- Loading -->

<div id="loading">

<div class="loader"></div>

<h2>Opening Chishti Reader...</h2>

</div>

<!-- Header -->

<header class="topbar">

<div class="logo">

<i class="fa-solid fa-book-open"></i>

<span>Chishti Reader Pro</span>

</div>

<div class="book-name" id="bookTitle">

Loading Book...

</div>

<div class="top-buttons">

<button id="theme">

<i class="fa-solid fa-moon"></i>

</button>

<button id="fullscreen">

<i class="fa-solid fa-expand"></i>

</button>

<button onclick="location.href='../books.html'">

<i class="fa-solid fa-arrow-left"></i>

</button>

</div>

</header>

<!-- Sidebar -->

<aside id="sidebar">

<div class="sidebar-title">

Book Pages

</div>

<div id="thumbnailContainer">

<!-- JS -->

</div>

</aside>

<!-- Main Reader -->

<main class="reader-area">

<div class="book-container">

<canvas id="pdfCanvas"></canvas>

</div>

</main>

<!-- Progress -->

<div class="progress">

<div id="readingProgress"></div>

</div>

<!-- Bottom Toolbar -->

<footer class="toolbar">

<button id="prev">

<i class="fa-solid fa-chevron-left"></i>

</button>

<button id="zoomOut">

<i class="fa-solid fa-magnifying-glass-minus"></i>

</button>

<div class="page-box">

<span id="pageCounter">1</span>

/

<span id="totalPages">0</span>

</div>

<button id="zoomIn">

<i class="fa-solid fa-magnifying-glass-plus"></i>

</button>

<button id="bookmark">

<i class="fa-solid fa-bookmark"></i>

</button>

<button id="print">

<i class="fa-solid fa-print"></i>

</button>

<button id="download">

<i class="fa-solid fa-download"></i>

</button>

<button id="next">

<i class="fa-solid fa-chevron-right"></i>

</button>

</footer>

<!-- PDF.js -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>

<!-- Reader -->

<script src="pdf-reader.js"></script>

<script src="reader.js"></script>

</body>

</html>
