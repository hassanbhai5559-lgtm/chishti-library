<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Chishti Library Reader</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="assets/css/reader.css">
<script
src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.js">
</script>

</head>

<body>

<!--==================================================
                    PRELOADER
===================================================-->

<div id="preloader">

<div class="loader">

<div class="loaderBook">

<div class="loaderFront"></div>

<div class="loaderPages"></div>

</div>

<p>

Opening Book...

</p>

</div>

</div>

<!--==================================================
                OPENING ANIMATION
===================================================-->

<div id="openingAnimation">

<div class="openingGlow"></div>

<div class="openingBook">

<div class="openingCover"></div>

<div class="openingPage"></div>

</div>

</div>

<!--==================================================
                    READER
===================================================-->

<div id="reader">

<!--==================================================
                HEADER
===================================================-->

<header id="readerHeader">

<div id="readerLogo">

<img
src="assets/images/logo.png"
alt="Logo">

<h1>

CHISHTI LIBRARY

</h1>

</div>

<div id="bookInfo">

<h2 id="bookTitle">

Loading Book...

</h2>

<p id="bookAuthor">

</p>

</div>

<div id="headerButtons">

<button
id="bookmarkBtn"
title="Bookmark">

⭐

</button>

<button
id="searchBtn"
title="Search">

🔍

</button>

<button
id="themeBtn"
title="Theme">

🌙

</button>

<button
id="settingBtn"
title="Settings">

⚙

</button>

<button
id="fullScreenBtn"
title="Fullscreen">

⛶

</button>

<button
id="closeBtn"
title="Close">

✕

</button>

</div>

</header>

<!--==================================================
            HTML PART 1 END
===================================================-->
<!--==================================================
                TOP TOOLBAR
===================================================-->

<div id="toolbarTop">

<div id="navigationGroup">

<button
id="firstPageBtn"
title="First Page">

⏮

</button>

<button
id="previousBtn"
title="Previous Page">

◀

</button>

<div id="pageCounter">

1 / 1

</div>

<button
id="nextBtn"
title="Next Page">

▶

</button>

<button
id="lastPageBtn"
title="Last Page">

⏭

</button>

</div>

<div id="zoomGroup">

<button
id="zoomOutBtn"
title="Zoom Out">

－

</button>

<div id="zoomIndicator">

100%

</div>

<button
id="zoomInBtn"
title="Zoom In">

＋

</button>

<button
id="fitPageBtn"
title="Fit Page">

Fit

</button>

<button
id="fitWidthBtn"
title="Fit Width">

Width

</button>

<button
id="resetZoomBtn"
title="Reset Zoom">

100%

</button>

</div>

</div>

<!--==================================================
            SECOND TOOLBAR
===================================================-->

<div id="toolbarBottom">

<div id="searchContainer">

<input
type="text"
id="searchKeyword"
placeholder="Search in complete book...">

<button
id="searchBookBtn">

Search

</button>

<button
id="previousSearchBtn">

▲

</button>

<button
id="nextSearchBtn">

▼

</button>

</div>

<div id="readerModes">

<button
id="singleModeBtn">

1 Page

</button>

<button
id="doubleModeBtn">

2 Pages

</button>

<button
id="autoModeBtn">

Auto

</button>

</div>

</div>

<!--==================================================
                READER BODY
===================================================-->

<div id="readerBody">
<!--==================================================
                BOOK VIEWPORT
===================================================-->

<div id="bookViewport">

<div id="canvasWrapper">

<div id="bookShadow"></div>

<div id="pageFlipContainer">

<div id="pageFront">

<canvas
id="leftCanvas">
</canvas>

</div>

<div id="pageBack">

<canvas
id="rightCanvas">
</canvas>

</div>

</div>

<div id="pageCurve"></div>

<div id="pageShadow"></div>

<div id="pageGlow"></div>

<div id="watermark">

CHISHTI LIBRARY

</div>

<div id="floatingPageNumber">

1

</div>

</div>

</div>

<!--==================================================
            MOBILE NAVIGATION
===================================================-->

<div id="mobileNavigation">

<button
id="mobilePrevBtn">

◀ Previous

</button>

<div id="mobilePageCounter">

<span id="mobileCurrentPage">

1

</span>

/

<span id="mobileTotalPages">

1

</span>

</div>

<button
id="mobileNextBtn">

Next ▶

</button>

</div>

<!--==================================================
                READER OVERLAY
===================================================-->

<div id="readerOverlay"></div>

<!--==================================================
                HTML PART 3 END
===================================================-->
<!--==================================================
                SEARCH PANEL
===================================================-->

<aside id="searchPanel" class="sidePanel">

<div class="panelHeader">

<h3>

Search Book

</h3>

<button
id="closeSearchPanelBtn">

✕

</button>

</div>

<div class="panelBody">

<input
type="text"
id="searchInput"
placeholder="Type any word...">

<button
id="searchNowBtn">

Search

</button>

<div id="searchResults">

</div>

</div>

</aside>

<!--==================================================
                BOOKMARK PANEL
===================================================-->

<aside id="bookmarkPanel" class="sidePanel">

<div class="panelHeader">

<h3>

Bookmarks

</h3>

<button
id="closeBookmarkBtn">

✕

</button>

</div>

<div
class="panelBody"
id="bookmarkList">

</div>

</aside>

<!--==================================================
                SETTINGS PANEL
===================================================-->

<aside id="settingsPanel" class="sidePanel">

<div class="panelHeader">

<h3>

Reader Settings

</h3>

<button
id="closeSettingsBtn">

✕

</button>

</div>

<div class="panelBody">

<div class="settingItem">

<label>

Page Animation

</label>

<input
type="checkbox"
id="pageAnimation"
checked>

</div>

<div class="settingItem">

<label>

Page Shadow

</label>

<input
type="checkbox"
id="pageShadowSwitch"
checked>

</div>

<div class="settingItem">

<label>

Watermark

</label>

<input
type="checkbox"
id="watermarkSwitch"
checked>

</div>

<div class="settingItem">

<label>

Theme

</label>

<select id="themeSelect">

<option value="dark">

Dark

</option>

<option value="light">

Light

</option>

</select>

</div>

<div class="settingItem">

<label>

Reading Mode

</label>

<select id="readingMode">

<option value="auto">

Auto

</option>

<option value="single">

Single Page

</option>

<option value="double">

Double Page

</option>

</select>

</div>

</div>

</aside>

<!--==================================================
                HTML PART 4 END
===================================================-->
<!--==================================================
                TABLE OF CONTENTS
===================================================-->

<aside id="tocPanel" class="sidePanel">

<div class="panelHeader">

<h3>

Table Of Contents

</h3>

<button
id="closeTocBtn">

✕

</button>

</div>

<div
class="panelBody"
id="tocList">

</div>

</aside>

<!--==================================================
                THUMBNAIL SIDEBAR
===================================================-->

<aside id="thumbnailSidebar">

<div id="thumbnailHeader">

<h3>

Pages

</h3>

<button
id="closeThumbnailBtn">

✕

</button>

</div>

<div id="thumbnailContainer">

</div>

</aside>

<!--==================================================
                LOADING SCREEN
===================================================-->

<div id="loadingScreen">

<div class="loadingCard">

<div class="loadingBook">

<div class="loadingCover"></div>

<div class="loadingPages"></div>

</div>

<h3 id="loadingStatus">

Loading Book...

</h3>

<div id="loadingProgress">

<div id="loadingBar"></div>

</div>

</div>

</div>

<!--==================================================
                ERROR SCREEN
===================================================-->

<div id="errorScreen">

<div class="errorCard">

<h2>

Unable To Open Book

</h2>

<p id="errorMessage">

Unknown Error

</p>

<button
id="reloadBookBtn">

Reload

</button>

<button
id="goHomeBtn">

Home

</button>

</div>

</div>

<!--==================================================
                TOAST
===================================================-->

<div id="readerToast">

<span id="toastMessage">

Ready

</span>

</div>

</div>

</body>

</html>
