<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CHISHTI READER</title>

<link
rel="stylesheet"
href="reader.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script
src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
</script>

</head>

<body>

<!--==================================================
BACKGROUND
===================================================-->

<div class="reader-background"></div>

<!--==================================================
MAIN READER
===================================================-->

<div class="reader">

<!--==================================================
PREMIUM TOOLBAR
===================================================-->

<header class="reader-toolbar">

    <!-- LEFT -->

    <div class="toolbar-left">

        <button
        id="menuBtn"
        class="tool-btn">

            <i class="fas fa-bars"></i>

        </button>

        <div class="reader-logo">

            <img
            src="logo.png"
            alt="Chishti Library">

        </div>

        <div class="reader-title">

            <h2>

                CHISHTI READER

            </h2>

            <span>

                Premium Digital Library

            </span>

        </div>

    </div>

    <!-- CENTER -->

    <div class="toolbar-center">

        <div class="current-book">

            <i class="fas fa-book-open"></i>

            <span id="bookTitle">

                Loading Book...

            </span>

        </div>

    </div>

    <!-- RIGHT -->

    <div class="toolbar-right">

        <button
        id="bookmarkBtn"
        class="tool-btn">

            <i class="fas fa-bookmark"></i>

        </button>

        <button
        id="searchBtn"
        class="tool-btn">

            <i class="fas fa-search"></i>

        </button>

        <button
        id="themeBtn"
        class="tool-btn">

            <i class="fas fa-moon"></i>

        </button>

        <button
        id="settingsBtn"
        class="tool-btn">

            <i class="fas fa-gear"></i>

        </button>

    </div>

</header>

<!--==================================================
BOOK STAGE
===================================================-->

<section class="book-stage">

    <!-- Book Shadow -->

    <div class="book-shadow"></div>

    <!-- Main Book -->

    <div
    id="readerBook"
    class="book">

        <!--==============================
        LEFT PAGE
        ==============================-->

        <div
        class="page left-page">

            <div class="page-surface">

                <canvas
                id="leftCanvas">
                </canvas>

            </div>

        </div>

        <!--==============================
        BOOK SPINE
        ==============================-->

        <div
        class="book-spine">

            <div class="spine-shadow"></div>

            <div class="spine-line"></div>

            <div class="spine-light"></div>

        </div>

        <!--==============================
        RIGHT PAGE
        ==============================-->

        <div
        class="page right-page">

            <div class="page-surface">

                <canvas
                id="rightCanvas">
                </canvas>

            </div>

        </div>

        <!--==============================
        PAGE TURN EFFECT
        ==============================-->

        <div
        class="page-flip-overlay">
        </div>

    </div>

</section>

<!--==================================================
PREMIUM BOTTOM TOOLBAR
===================================================-->

<footer class="reader-bottom">

    <!-- LEFT -->

    <div class="bottom-group">

        <button
        id="firstPage"
        class="reader-btn"
        title="First Page">

            <i class="fas fa-backward-fast"></i>

        </button>

        <button
        id="prevPage"
        class="reader-btn"
        title="Previous">

            <i class="fas fa-chevron-left"></i>

        </button>

    </div>

    <!-- CENTER -->

    <div class="page-display">

        <span id="pageCounter">

            1 - 2

        </span>

        <span class="separator">

            /

        </span>

        <span id="totalPages">

            0

        </span>

    </div>

    <!-- RIGHT -->

    <div class="bottom-group">

        <button
        id="zoomOut"
        class="reader-btn"
        title="Zoom Out">

            <i class="fas fa-search-minus"></i>

        </button>

        <button
        id="zoomIn"
        class="reader-btn"
        title="Zoom In">

            <i class="fas fa-search-plus"></i>

        </button>

        <button
        id="downloadBtn"
        class="reader-btn"
        title="Download">

            <i class="fas fa-download"></i>

        </button>

        <button
        id="printBtn"
        class="reader-btn"
        title="Print">

            <i class="fas fa-print"></i>

        </button>

        <button
        id="fullscreenBtn"
        class="reader-btn"
        title="Fullscreen">

            <i class="fas fa-expand"></i>

        </button>

        <button
        id="nextPage"
        class="reader-btn"
        title="Next">

            <i class="fas fa-chevron-right"></i>

        </button>

        <button
        id="lastPage"
        class="reader-btn"
        title="Last Page">

            <i class="fas fa-forward-fast"></i>

        </button>

    </div>

</footer>

</div>


 <!--====================================================
SEARCH POPUP
Paste Before </body>
=====================================================-->

<div id="searchOverlay" class="search-overlay">

    <div class="search-box">

        <div class="search-header">

            <h3>Search Book</h3>

            <button id="closeSearch">
                <i class="fas fa-times"></i>
            </button>

        </div>

        <div class="search-input-area">

            <input
            type="text"
            id="searchInput"
            placeholder="Search inside this book...">

            <button id="startSearch">

                <i class="fas fa-search"></i>

            </button>

        </div>

        <div
        id="searchResults"
        class="search-results">

        </div>

    </div>

</div>   
<!-- END READER -->

<script src="reader.js"></script>

</body>
</html>
