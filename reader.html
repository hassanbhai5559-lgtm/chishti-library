<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Chishti Reader</title>

<!-- Reader CSS -->

<link
rel="stylesheet"
href="reader.css">

<!-- Google Font -->

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<!-- Font Awesome -->

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- PDF.js -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

</head>

<body>

<!--==========================================
BACKGROUND
===========================================-->

<div class="reader-background">

    <div class="background-overlay"></div>

    <div class="background-grid"></div>

</div>

<!--==========================================
PRELOADER
===========================================-->

<div id="preloader" class="preloader">

    <div class="loader-book">

        <span></span>

        <span></span>

        <span></span>

    </div>

    <h1>

        CHISHTI READER

    </h1>

    <p>

        Preparing Premium Reader...

    </p>

</div>

<!--==========================================
MAIN APPLICATION
===========================================-->

<div id="readerApp" class="reader-app">

<!--==================================================
PREMIUM TOP TOOLBAR
PART 2
===================================================-->

<header class="reader-toolbar">

    <!--==============================
    LEFT SECTION
    ==============================-->

    <div class="toolbar-left">

        <!-- Menu -->

        <button
        id="menuBtn"
        class="tool-btn"
        title="Menu">

            <i class="fas fa-bars"></i>

        </button>

        <!-- Brand -->

        <div class="reader-brand">

            <div class="reader-logo">

                <img
                src="logo.png"
                alt="Chishti Library Logo">

            </div>

            <div class="reader-title">

                <h2>

                    CHISHTI READER

                </h2>

                <span>

                    Premium Islamic Digital Library

                </span>

            </div>

        </div>

    </div>

    <!--==============================
    CENTER
    ==============================-->

    <div class="toolbar-center">

        <div class="current-book">

            <i class="fas fa-book-open"></i>

            <span id="bookTitle">

                Loading Book...

            </span>

        </div>

    </div>

    <!--==============================
    RIGHT SECTION
    ==============================-->

    <div class="toolbar-right">

        <!-- Bookmark -->

        <button
        id="bookmarkBtn"
        class="tool-btn"
        title="Bookmark">

            <i class="fas fa-bookmark"></i>

        </button>

        <!-- Search -->

        <button
        id="searchBtn"
        class="tool-btn"
        title="Search">

            <i class="fas fa-search"></i>

        </button>

        <!-- Theme -->

        <button
        id="themeBtn"
        class="tool-btn"
        title="Theme">

            <i class="fas fa-moon"></i>

        </button>

        <!-- Settings -->

        <button
        id="settingsBtn"
        class="tool-btn"
        title="Settings">

            <i class="fas fa-gear"></i>

        </button>

    </div>

</header>

<!--==================================================
BOOK STAGE
PART 3
===================================================-->

<main class="reader-stage">

    <!--==============================
    BACKGROUND GLOW
    ==============================-->

    <div class="book-glow glow-left"></div>

    <div class="book-glow glow-right"></div>

    <!--==============================
    BOOK SHADOW
    ==============================-->

    <div class="book-shadow"></div>

    <!--==============================
    MAIN BOOK
    ==============================-->

    <section
    id="readerBook"
    class="reader-book">

        <!--==========================
        LEFT PAGE
        ==========================-->

        <article
        class="book-page left-page">

            <div class="page-layer">

                <canvas
                id="leftCanvas">
                </canvas>

            </div>

            <div class="page-highlight"></div>

        </article>

        <!--==========================
        BOOK SPINE
        ==========================-->

        <div class="book-spine">

            <div class="spine-left-shadow"></div>

            <div class="spine-center-line"></div>

            <div class="spine-right-highlight"></div>

        </div>

        <!--==========================
        RIGHT PAGE
        ==========================-->

        <article
        class="book-page right-page">

            <div class="page-layer">

                <canvas
                id="rightCanvas">
                </canvas>

            </div>

            <div class="page-highlight"></div>

        </article>

    </section>

</main>

<!--==================================================
PREMIUM BOTTOM NAVIGATION
PART 4
===================================================-->

<footer class="reader-bottom">

    <!--==============================
    LEFT CONTROLS
    ==============================-->

    <div class="bottom-left">

        <button
        id="firstPageBtn"
        class="reader-btn"
        title="First Page">

            <i class="fas fa-backward-fast"></i>

        </button>

        <button
        id="prevPageBtn"
        class="reader-btn"
        title="Previous Page">

            <i class="fas fa-chevron-left"></i>

        </button>

    </div>

    <!--==============================
    PAGE COUNTER
    ==============================-->

    <div class="bottom-center">

        <div class="page-counter">

            <span id="currentPageDisplay">

                1 - 2

            </span>

            <span class="divider">

                /

            </span>

            <span id="totalPagesDisplay">

                0

            </span>

        </div>

    </div>

    <!--==============================
    RIGHT CONTROLS
    ==============================-->

    <div class="bottom-right">

        <button
        id="zoomOutBtn"
        class="reader-btn"
        title="Zoom Out">

            <i class="fas fa-search-minus"></i>

        </button>

        <button
        id="zoomInBtn"
        class="reader-btn"
        title="Zoom In">

            <i class="fas fa-search-plus"></i>

        </button>

        <button
        id="downloadPdfBtn"
        class="reader-btn"
        title="Download PDF">

            <i class="fas fa-download"></i>

        </button>

        <button
        id="printPdfBtn"
        class="reader-btn"
        title="Print">

            <i class="fas fa-print"></i>

        </button>

        <button
        id="fullscreenReaderBtn"
        class="reader-btn"
        title="Fullscreen">

            <i class="fas fa-expand"></i>

        </button>

        <button
        id="nextPageBtn"
        class="reader-btn"
        title="Next Page">

            <i class="fas fa-chevron-right"></i>

        </button>

        <button
        id="lastPageBtn"
        class="reader-btn"
        title="Last Page">

            <i class="fas fa-forward-fast"></i>

        </button>

    </div>

</footer>

<!--==================================================
SEARCH WINDOW
PART 5
===================================================-->

<div id="searchOverlay" class="overlay">

    <div class="popup-window search-window">

        <div class="popup-header">

            <h3>

                <i class="fas fa-search"></i>

                Search Book

            </h3>

            <button
            id="closeSearchBtn"
            class="popup-close">

                <i class="fas fa-times"></i>

            </button>

        </div>

        <div class="popup-body">

            <div class="search-bar">

                <input
                id="searchInput"
                type="text"
                placeholder="Search inside this book...">

                <button
                id="startSearchBtn">

                    <i class="fas fa-search"></i>

                </button>

            </div>

            <div
            id="searchResults"
            class="search-results">

            </div>

        </div>

    </div>

</div>

<!--==================================================
SETTINGS WINDOW
===================================================-->

<div id="settingsOverlay" class="overlay">

    <div class="popup-window settings-window">

        <div class="popup-header">

            <h3>

                <i class="fas fa-gear"></i>

                Reader Settings

            </h3>

            <button
            id="closeSettingsBtn"
            class="popup-close">

                <i class="fas fa-times"></i>

            </button>

        </div>

        <div class="popup-body">

            <div class="setting-item">

                <label>

                    Theme

                </label>

                <select id="themeSelect">

                    <option value="maroon">Maroon Gold</option>

                    <option value="dark">Dark</option>

                    <option value="light">Light</option>

                    <option value="sepia">Sepia</option>

                </select>

            </div>

            <div class="setting-item">

                <label>

                    Default Zoom

                </label>

                <input
                id="defaultZoom"
                type="range"
                min="1"
                max="3"
                step="0.1"
                value="1.5">

            </div>

            <div class="setting-item">

                <label>

                    Page Animation

                </label>

                <input
                id="animationToggle"
                type="checkbox"
                checked>

            </div>

            <div class="setting-item">

                <label>

                    Continue Reading

                </label>

                <input
                id="continueReadingToggle"
                type="checkbox"
                checked>

            </div>

        </div>

        <div class="popup-footer">

            <button
            id="saveSettingsBtn">

                Save Settings

            </button>

        </div>

    </div>

</div>

<!--==================================================
BOOKMARK WINDOW
===================================================-->

<div id="bookmarkOverlay" class="overlay">

    <div class="popup-window bookmark-window">

        <div class="popup-header">

            <h3>

                <i class="fas fa-bookmark"></i>

                Bookmarks

            </h3>

            <button
            id="closeBookmarkBtn"
            class="popup-close">

                <i class="fas fa-times"></i>

            </button>

        </div>

        <div
        id="bookmarkList"
        class="popup-body">

            <div class="empty-state">

                No bookmarks yet.

            </div>

        </div>

    </div>

</div>

<!--==================================================
TOAST NOTIFICATION
PART 6
===================================================-->

<div id="toast" class="toast">

    <i class="fas fa-circle-check"></i>

    <span id="toastText">

        Done

    </span>

</div>

<!--==================================================
LOADING BAR
===================================================-->

<div id="loadingBar" class="loading-bar">

    <div id="loadingProgress" class="loading-progress"></div>

</div>

<!--==================================================
PDF LOADING SCREEN
===================================================-->

<div id="pdfLoading" class="pdf-loading">

    <div class="pdf-loader">

        <span></span>

        <span></span>

        <span></span>

    </div>

    <h2>

        Preparing Book...

    </h2>

    <p>

        Optimizing pages for fast reading

    </p>

</div>

<!--==================================================
SCREEN DIMMER
===================================================-->

<div id="screenDimmer" class="screen-dimmer"></div>

<!--==================================================
READER JAVASCRIPT
===================================================-->

<script src="reader.js"></script>

</div>

</body>
</html>
