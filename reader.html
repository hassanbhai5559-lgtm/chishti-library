<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chishti Library Reader</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,Arial,sans-serif;
}

body{
background:#eef3f8;
overflow:hidden;
}

header{

height:70px;

background:linear-gradient(135deg,#0b6b3a,#1565c0);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 20px;

color:white;

box-shadow:0 5px 20px rgba(0,0,0,.2);

}

.logo{

display:flex;

align-items:center;

gap:12px;

}

.logo img{

height:45px;

}

.logo h2{

font-size:22px;

}

.tools{

display:flex;

gap:10px;

}

.tools button{

padding:10px 14px;

border:none;

border-radius:8px;

cursor:pointer;

font-size:16px;

background:white;

color:#0b6b3a;

font-weight:bold;

transition:.3s;

}

.tools button:hover{

background:#ffd54f;

transform:translateY(-2px);

}

iframe{

width:100%;

height:calc(100vh - 70px);

border:none;

background:white;

}

.dark{

background:#111;

}

.dark iframe{

filter:invert(.92) hue-rotate(180deg);

}

</style>

</head>

<body>

<header>

<div class="logo">

<img src="logo.png">

<h2 id="bookTitle">

Chishti Library

</h2>

</div>

<div class="tools">

<button onclick="zoomOut()">➖</button>

<button onclick="zoomIn()">➕</button>

<button onclick="toggleDark()">🌙</button>

<button onclick="printBook()">🖨</button>

<button onclick="downloadBook()">⬇</button>

<button onclick="fullscreen()">⛶</button>

<button onclick="history.back()">⬅ Back</button>

</div>

</header>

<iframe id="viewer"></iframe>

<script>

const params=new URLSearchParams(window.location.search);

const pdf=params.get("book");

const title=params.get("title");

document.getElementById("bookTitle").innerHTML=decodeURIComponent(title||"Book");

const viewer=document.getElementById("viewer");

viewer.src=pdf;

let zoom=100;

function zoomIn(){

zoom+=10;

viewer.style.transform="scale("+(zoom/100)+")";

viewer.style.transformOrigin="top center";

}

function zoomOut(){

if(zoom>50){

zoom-=10;

viewer.style.transform="scale("+(zoom/100)+")";

}

}

function printBook(){

window.open(pdf);

}

function downloadBook(){

const a=document.createElement("a");

a.href=pdf;

a.download="";

a.click();

}

function fullscreen(){

document.documentElement.requestFullscreen();

}

function toggleDark(){

document.body.classList.toggle("dark");

}

</script>

</body>
</html>
