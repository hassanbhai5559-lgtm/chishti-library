     reader.html
========================================================== -->

<!DOCTYPE html>
<html lang="en" data-theme="maroon">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
CHISHTI BOOK READER
</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css">

<link
rel="stylesheet"
href="reader.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>

<script src="reader.js"></script>

</head>

<body>

<div
id="app"
class="app">

    <!-- Background -->

    <div class="background">

        <div class="bg-left"></div>

        <div class="bg-right"></div>

        <div class="bg-pattern"></div>

    </div>

    <!-- Loader -->

    <div
    id="loader"
    class="loader">

        <div class="loader-book">

            <div></div>

            <div></div>

            <div></div>

        </div>

        <h2>

            CHISHTI BOOK READER

        </h2>

    </div>

    <!-- Header -->

    <header
    class="header">

        <div
        class="header-left">

            <img

            id="logo"

            class="logo"

            src="assets/logo.png"

            alt="Logo">

            <div>

                <h1>

                    CHISHTI BOOK READER

                </h1>

                <p>

                  Islamic Digital Library

                </p>

            </div>

        </div>

        <div
        class="header-center">

            <div
            class="search">

                <i
                class="ri-search-line">

                </i>

                <input

                id="searchInput"

                type="text"

                placeholder="Search inside book...">

            </div>

        </div>

        <div
        class="header-right">

            <button
            id="bookmarkButton">

                <i
                class="ri-bookmark-line">

                </i>

            </button>

            <button
            id="themeButton">

                <i
                class="ri-palette-line">

                </i>

            </button>

            <button
            id="settingButton">

                <i
                class="ri-settings-3-line">

                </i>

            </button>

            <button
            id="fullscreenButton">

                <i
                class="ri-fullscreen-line">

                </i>

            </button>

        </div>

    </header>

    <!-- Reader -->

    <main
    class="reader">

        <div
        id="bookStage"
        class="book-stage">

            <div
            class="book-shadow">

            </div>

            <div
            id="book"
            class="book closed">

                <div
                class="cover front-cover">

                </div>

                <section
                class="page left-page">

                    <canvas
                    id="leftCanvas">

                    </canvas>

                </section>

                <div
                class="spine">

                </div>

                <section
                class="page right-page">

                    <canvas
                    id="rightCanvas">

                    </canvas>

                </section>

                <div
                class="cover back-cover">

                </div>

            </div>

        </div>

    </main>

    <!-- Bottom Bar -->

    <footer
    class="toolbar">

        <button
        id="firstPage">

            <i class="ri-skip-left-fill"></i>

        </button>

        <button
        id="previousPage">

            <i class="ri-arrow-left-s-line"></i>

        </button>

        <div
        class="page-counter">

            <input

            id="pageInput"

            type="number"

            value="1">

            <span>

                /

            </span>

            <span
            id="totalPages">

                0

            </span>

        </div>

        <button
        id="nextPage">

            <i class="ri-arrow-right-s-line"></i>

        </button>

        <button
        id="lastPage">

            <i class="ri-skip-right-fill"></i>

        </button>

        <button
        id="zoomOut">

            <i class="ri-subtract-line"></i>

        </button>

        <span
        id="zoomValue">

            100%

        </span>

        <button
        id="zoomIn">

            <i class="ri-add-line"></i>

        </button>

        <button
        id="rotateBook">

            <i class="ri-refresh-line"></i>

        </button>

    </footer>

    <!-- Panels -->

    <aside
    id="searchPanel"
    class="panel">

        <div
        id="searchResults">

        </div>

    </aside>

    <aside
    id="themePanel"
    class="panel">

    </aside>

    <aside
    id="settingsPanel"
    class="panel">

    </aside>

    <aside
    id="bookmarkPanel"
    class="panel">

        <div
        id="bookmarkList">

        </div>

    </aside>

    <aside
    id="tocPanel"
    class="panel">

        <div
        id="tocList">

        </div>

        <div
        id="thumbnailList">

        </div>

    </aside>

    <!-- Toast -->

    <div
    id="toastContainer">

    </div>

</div>

</body>

</html>
