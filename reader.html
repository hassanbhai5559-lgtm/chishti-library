<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Chishti Library Reader V2</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="assets/css/reader.css">

<script
src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
</script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>

</head>

<body>

<!--==========================================
            BOOK OPENING SCREEN
===========================================-->

<div id="openingScreen">

<div id="openingGlow"></div>

<div id="openingBook">

<div id="bookCoverFront">

<div id="coverLogo">

<img
src="assets/images/logo.png"
alt="Chishti Library">

</div>

<h1>

CHISHTI LIBRARY

</h1>

<p>

Digital Islamic Library

</p>

</div>

<div id="bookPaperStack"></div>

<div id="bookShadow"></div>

</div>

</div>

<!--==========================================
                READER
===========================================-->

<div id="reader">

<!--==========================================
                HEADER
===========================================-->

<header id="readerHeader">

<div id="headerLeft">

<img
id="libraryLogo"
src="assets/images/logo.png"
alt="Logo">

<div>

<h2 id="bookTitle">

Loading Book...

</h2>

<p id="bookAuthor">

Author

</p>

</div>

</div>

<div id="headerRight">

<button id="btnSearch">

🔍

</button>

<button id="btnBookmark">

⭐

</button>

<button id="btnTheme">

🌙

</button>

<button id="btnSettings">

⚙

</button>

<button id="btnFullscreen">

⛶

</button>

<button id="btnClose">

✕

</button>

</div>

</header>

<!--==========================================
            HTML PART 1 END
===========================================-->
<!--==========================================
            READER BODY
===========================================-->

<main id="readerBody">

<div id="bookStage">

<div id="bookLight"></div>

<div id="bookContainer">

<!--==========================================
            LEFT PAGE
===========================================-->

<div
class="bookPage leftPage"
id="leftPage">

<canvas
id="leftCanvas">
</canvas>

<div class="pageGradient"></div>

<div class="pageTexture"></div>

</div>

<!--==========================================
            BOOK SPINE
===========================================-->

<div id="bookSpine">

<div id="spineShadow"></div>

</div>

<!--==========================================
            RIGHT PAGE
===========================================-->

<div
class="bookPage rightPage"
id="rightPage">

<canvas
id="rightCanvas">
</canvas>

<div class="pageGradient"></div>

<div class="pageTexture"></div>

</div>

<!--==========================================
        REAL PAGE FLIP LAYER
===========================================-->

<div id="pageFlipLayer">

<div id="flipFront">

<canvas
id="flipCanvas">
</canvas>

</div>

<div id="flipBack">

<canvas
id="flipBackCanvas">
</canvas>

</div>

</div>

</div>

<!--==========================================
        PAGE GLOW & SHADOW
===========================================-->

<div id="pageShadow"></div>

<div id="pageReflection"></div>

<div id="pageGlow"></div>

</div>

</main>

<!--==========================================
            HTML PART 2 END
===========================================-->
<!--==========================================
        PAGE COUNTER + ACTION BAR
===========================================-->

<section id="readerBottomBar">

<div id="pageCounterContainer">

<button
id="btnPrevPage"
class="navButton"
title="Previous Page">

❮

</button>

<div id="pageCounter">

<span id="currentPage">

1

</span>

<span class="counterDivider">

/

</span>

<span id="totalPages">

1

</span>

</div>

<button
id="btnNextPage"
class="navButton"
title="Next Page">

❯

</button>

</div>

<div id="bookActions">

<button
id="btnLike"
class="actionButton">

<span class="actionIcon">

❤️

</span>

<span class="actionText">

Like

</span>

<span
id="likeCount"
class="actionCount">

0

</span>

</button>

<button
id="btnShare"
class="actionButton">

<span class="actionIcon">

🔗

</span>

<span class="actionText">

Share

</span>

</button>

<button
id="btnBookmarkHistory"
class="actionButton">

<span class="actionIcon">

⭐

</span>

<span class="actionText">

Bookmarks

</span>

</button>

<button
id="btnComments"
class="actionButton">

<span class="actionIcon">

💬

</span>

<span class="actionText">

Comments

</span>

<span
id="commentCount"
class="actionCount">

0

</span>

</button>

</div>

</section>

<!--==========================================
        HTML PART 3 END
===========================================-->
<!--==========================================
        BOOKMARK HISTORY PANEL
===========================================-->

<aside id="bookmarkPanel" class="sidePanel">

<div class="panelHeader">

<h2>

Bookmarks

</h2>

<button
id="closeBookmarkPanel">

✕

</button>

</div>

<div
id="bookmarkList"
class="panelContent">

<!-- JavaScript -->

</div>

</aside>

<!--==========================================
        COMMENTS PANEL
===========================================-->

<aside id="commentPanel" class="sidePanel">

<div class="panelHeader">

<h2>

Comments

</h2>

<button
id="closeCommentPanel">

✕

</button>

</div>

<div class="panelContent">

<div id="commentForm">

<input
type="text"
id="commentName"
placeholder="Your Name">

<textarea
id="commentMessage"
placeholder="Write your comment...">
</textarea>

<button
id="submitComment">

Post Comment

</button>

</div>

<div id="commentList">

<!-- Firebase Comments -->

</div>

</div>

</aside>

<!--==========================================
        SEARCH PANEL
===========================================-->

<aside id="searchPanel" class="sidePanel">

<div class="panelHeader">

<h2>

Search Book

</h2>

<button
id="closeSearchPanel">

✕

</button>

</div>

<div class="panelContent">

<input
type="search"
id="searchInput"
placeholder="Search in book...">

<button
id="searchButton">

Search

</button>

<div id="searchResults">

</div>

</div>

</aside>

<!--==========================================
        HTML PART 4 END
===========================================-->
<!--==========================================
            SETTINGS PANEL
===========================================-->

<aside id="settingsPanel" class="sidePanel">

<div class="panelHeader">

<h2>

Reader Settings

</h2>

<button
id="closeSettingsPanel">

✕

</button>

</div>

<div class="panelContent">

<div class="settingItem">

<label>

Theme

</label>

<select id="themeSelector">

<option value="dark">

Dark Blue

</option>

<option value="light">

Light

</option>

<option value="maroon">

Maroon & Gold

</option>

<option value="gold">

Gold & Maroon

</option>

</select>

</div>

<div class="settingItem">

<label>

Reading Mode

</label>

<select id="readingMode">

<option value="single">

Single Page

</option>

<option value="double">

Double Page

</option>

<option value="auto">

Auto

</option>

</select>

</div>

<div class="settingItem">

<label>

Page Flip Animation

</label>

<input
type="checkbox"
id="flipAnimation"
checked>

</div>

<div class="settingItem">

<label>

Page Shadow

</label>

<input
type="checkbox"
id="pageShadow"
checked>

</div>

<div class="settingItem">

<label>

Watermark

</label>

<input
type="checkbox"
id="watermarkSwitch"
checked>

</div>

</div>

</aside>

<!--==========================================
            READER OVERLAY
===========================================-->

<div id="readerOverlay">

</div>

<!--==========================================
            LOADING STATUS
===========================================-->

<div id="loadingStatus">

<div id="loadingSpinner">

</div>

<p id="loadingText">

Opening Book...

</p>

</div>

<!--==========================================
            HTML PART 5 END
===========================================-->
<!--==========================================
            FIREBASE COMMENTS
===========================================-->

<section id="commentsSection">

<div id="commentsHeader">

<h2>

Reader Discussion

</h2>

<span id="totalComments">

0 Comments

</span>

</div>

<div id="firebaseComments">

<!-- Firebase Comments -->

</div>

</section>

<!--==========================================
            READER TOAST
===========================================-->

<div id="toast">

<span id="toastText">

Ready

</span>

</div>

<!--==========================================
            ERROR SCREEN
===========================================-->

<div id="errorScreen">

<div id="errorCard">

<h2>

Unable To Open Book

</h2>

<p id="errorMessage">

Unknown Error

</p>

<button id="reloadBook">

Reload Book

</button>

<button id="goHome">

Back To Library

</button>

</div>

</div>

<!--==========================================
            FOOTER
===========================================-->

<footer id="readerFooter">

<div id="footerLeft">

<span>

© Chishti Library

</span>

</div>

<div id="footerCenter">

<span id="footerPage">

1 / 1

</span>

</div>

<div id="footerRight">

<span id="footerZoom">

100%

</span>

</div>

</footer>

</div>

<!--==========================================
            READER SCRIPT
===========================================-->

<script
src="assets/js/reader.js">
</script>

</body>

</html>
