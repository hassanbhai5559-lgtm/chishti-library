<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ChishtiLibrary.com Premium Digital Book Reader"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>Chishti Reader — ChishtiLibrary.com</title>

    <!-- Reader CSS -->
    <link
        rel="stylesheet"
        href="./reader.css"
    >

</head>

<body>

    <!-- =====================================================
         CHISHTI READER
         ===================================================== -->

    <main
        id="readerApp"
        class="reader-app"
        aria-label="ChishtiLibrary digital book reader"
    >

        <!-- =================================================
             TOP BAR
             ================================================= -->

        <header
            id="readerHeader"
            class="reader-header"
        >

            <div class="reader-brand">

                <div class="reader-brand-name">
                    ChishtiLibrary.com
                </div>

                <div class="reader-brand-title">
                    Chishti Reader
                </div>

            </div>


            <h1
                id="bookTitle"
                class="book-title"
            >
                Digital Book
            </h1>

        </header>


        <!-- =================================================
             BOOK AREA
             ================================================= -->

        <section
            id="readerArea"
            class="reader-area"
            aria-label="Book page"
        >

    


            <!-- PDF Page -->

            <div
                id="bookViewport"
                class="book-viewport"
            >

                <div
                    id="pageWrapper"
                    class="page-wrapper"
                >

                    <!-- PDF.js renders here -->

                    <canvas
                        id="pdfCanvas"
                        aria-label="Current book page"
                    ></canvas>


                    <!-- Watermark -->

                    <div
                        id="pageWatermark"
                        class="page-watermark"
                        aria-hidden="true"
                    >
                        ChishtiLibrary.com
                    </div>

                </div>

            </div>

        </section>


        <!-- =================================================
             BOTTOM CONTROLS
             ================================================= -->

        <nav
            id="readerControls"
            class="reader-controls"
            aria-label="Book controls"
        >

            <!-- Previous -->

            <button
                id="previousPageButton"
                class="control-button"
                type="button"
                title="Previous page"
                aria-label="Previous page"
            >
                <span aria-hidden="true">
                    ←
                </span>

                <span>
                    Previous
                </span>
            </button>


            <!-- Page Counter -->

            <div
                class="page-counter"
                aria-label="Page counter"
            >

                <label
                    for="pageNumberInput"
                    class="sr-only"
                >
                    Current page
                </label>

                <input
                    id="pageNumberInput"
                    class="page-number-input"
                    type="number"
                    min="1"
                    value="1"
                    inputmode="numeric"
                    aria-label="Current page number"
                >

                <span aria-hidden="true">
                    /
                </span>

                <span
                    id="totalPages"
                    class="total-pages"
                >
                    0
                </span>

            </div>


            <!-- Next -->

            <button
                id="nextPageButton"
                class="control-button"
                type="button"
                title="Next page"
                aria-label="Next page"
            >

                <span>
                    Next
                </span>

                <span aria-hidden="true">
                    →
                </span>

            </button>


            <!-- Divider -->

            <span
                class="control-divider"
                aria-hidden="true"
            ></span>


            <!-- Zoom Out -->

            <button
                id="zoomOutButton"
                class="control-button zoom-button"
                type="button"
                title="Zoom out"
                aria-label="Zoom out"
            >
                −
            </button>


            <!-- Zoom Level -->

            <button
                id="resetZoomButton"
                class="control-button zoom-level"
                type="button"
                title="Reset zoom"
                aria-label="Reset zoom"
            >
                <span id="zoomLevel">
                    100%
                </span>
            </button>


            <!-- Zoom In -->

            <button
                id="zoomInButton"
                class="control-button zoom-button"
                type="button"
                title="Zoom in"
                aria-label="Zoom in"
            >
                +
            </button>

        </nav>


        <!-- =================================================
             SCREEN READER STATUS
             ================================================= -->

        <div
            id="readerStatus"
            class="sr-only"
            role="status"
            aria-live="polite"
        ></div>

    </main>


    <!-- =====================================================
         PDF.JS
         ===================================================== -->

    <script
        type="module"
        src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
    ></script>


    <!-- =====================================================
         CHISHTI READER JS
         ===================================================== -->

    <script
        type="module"
        src="./reader.js"
    ></script>
<!-- =========================================
     READER
========================================= -->

<div id="readerMode" class="reader-mode">

    <div id="readerContent" class="reader-content">

        <!-- YAHAN BOOK KA CONTENT AAYEGA -->

        <h1 id="readerTitle">
            Chishti Library
        </h1>

        <p>
            Book reading area...
        </p>

    </div>


    <!-- READER CONTROLS -->

    <div class="reader-controls">

        <!-- Previous Page -->

        <button
            id="readerPrev"
            type="button"
            title="Previous Page"
            aria-label="Previous Page"
        >
            <i class="fas fa-chevron-left"></i>
        </button>


        <!-- Page -->

        <div
            id="readerPage"
            class="reader-page"
        >
            1 / 1
        </div>


        <!-- Next Page -->

        <button
            id="readerNext"
            type="button"
            title="Next Page"
            aria-label="Next Page"
        >
            <i class="fas fa-chevron-right"></i>
        </button>


        <!-- Font Decrease -->

        <button
            id="readerFontMinus"
            type="button"
            title="Decrease Text Size"
            aria-label="Decrease Text Size"
        >
            A-
        </button>


        <!-- Font Increase -->

        <button
            id="readerFontPlus"
            type="button"
            title="Increase Text Size"
            aria-label="Increase Text Size"
        >
            A+
        </button>


        <!-- Theme Swap -->

        <button
            id="readerTheme"
            type="button"
            title="Change Reader Theme"
            aria-label="Change Reader Theme"
        >
            <i class="fas fa-adjust"></i>
        </button>


        <!-- Close -->

        <button
            id="readerClose"
            class="reader-close"
            type="button"
            title="Close Reader"
            aria-label="Close Reader"
        >
            <i class="fas fa-xmark"></i>
        </button>

    </div>

</div>
    
</body>
</html>
