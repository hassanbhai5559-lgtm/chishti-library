<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Chishti Library Premium Digital Book Reader"
    >

    <meta
        name="theme-color"
        content="#350000"
    >

    <title>
        Chishti Reader
    </title>


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- Reader CSS -->

    <link
        rel="stylesheet"
        href="./reader.css"
    >


    <!-- PDF-LIB -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"
        defer
    ></script>

</head>


<body>


<main
    id="readerApp"
    class="reader-app"
>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header
        id="readerHeader"
        class="reader-header"
    >

        <div class="reader-brand">

            <div class="reader-brand-name">
                ChishtiLibrary.com
            </div>

            <div class="reader-brand-title">
                CHISHTI READER
            </div>

        </div>


        <h1
            id="bookTitle"
            class="book-title"
        >
            Digital Book
        </h1>

    </header>



    <!-- =====================================================
         READER AREA
    ====================================================== -->

    <section
        id="readerArea"
        class="reader-area"
    >


        <div
            id="bookViewport"
            class="book-viewport"
        >


            <div
                id="pageWrapper"
                class="page-wrapper"
            >

                <canvas
                    id="pdfCanvas"
                    aria-label="Current PDF page"
                ></canvas>


                <div
                    id="pageWatermark"
                    class="page-watermark"
                    aria-hidden="true"
                >
                    ChishtiLibrary.com
                </div>

            </div>


        </div>



        <!-- =================================================
             LOADING
        ================================================== -->

        <div
            id="loadingScreen"
            class="loading-screen"
        >

            <div class="loading-spinner"></div>

            <div
                id="loadingText"
                class="loading-text"
            >
                Loading PDF...
            </div>

        </div>



        <!-- =================================================
             ERROR
        ================================================== -->

        <div
            id="errorScreen"
            class="error-screen"
            hidden
        >

            <div class="error-icon">
                <i class="fas fa-triangle-exclamation"></i>
            </div>

            <h2>
                Unable to open book
            </h2>

            <p id="errorMessage">
                The selected PDF could not be loaded.
            </p>

            <button
                id="retryButton"
                class="control-button"
                type="button"
            >
                <i class="fas fa-rotate-right"></i>
                Try Again
            </button>

        </div>


    </section>



    <!-- =====================================================
         CONTROLS
    ====================================================== -->

    <nav
        id="readerControls"
        class="reader-controls"
    >


        <!-- SEARCH -->

        <div
            class="reader-search"
        >

            <div
                class="reader-search-box"
            >

                <span
                    class="reader-search-icon"
                >
                    <i class="fas fa-search"></i>
                </span>


                <input
                    id="readerSearchInput"
                    type="search"
                    placeholder="Search inside this book..."
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Search inside this book"
                >


                <button
                    id="readerSearchClear"
                    class="reader-search-clear"
                    type="button"
                    title="Clear search"
                    aria-label="Clear search"
                >
                    <i class="fas fa-xmark"></i>
                </button>


                <button
                    id="readerSearchButton"
                    class="reader-search-button"
                    type="button"
                    title="Search book"
                >
                    <i class="fas fa-search"></i>
                    <span>Search</span>
                </button>

            </div>


            <div
                id="readerSearchResults"
                class="reader-search-results"
            ></div>

        </div>



        <!-- PREVIOUS -->

        <button
            id="previousPageButton"
            class="control-button"
            type="button"
            title="Previous page"
        >

            <i class="fas fa-chevron-left"></i>

            <span class="button-label">
                Previous
            </span>

        </button>



        <!-- PAGE -->

        <div
            class="page-counter"
        >

            <input
                id="pageNumberInput"
                class="page-number-input"
                type="number"
                min="1"
                value="1"
                inputmode="numeric"
                aria-label="Current page"
            >

            <span>
                /
            </span>

            <span
                id="totalPages"
                class="total-pages"
            >
                0
            </span>

        </div>



        <!-- NEXT -->

        <button
            id="nextPageButton"
            class="control-button"
            type="button"
            title="Next page"
        >

            <span class="button-label">
                Next
            </span>

            <i class="fas fa-chevron-right"></i>

        </button>



        <!-- ZOOM OUT -->

        <button
            id="zoomOutButton"
            class="control-button icon-button"
            type="button"
            title="Zoom out"
        >

            <i class="fas fa-minus"></i>

        </button>



        <!-- ZOOM -->

        <button
            id="resetZoomButton"
            class="control-button zoom-display"
            type="button"
            title="Reset zoom"
        >

            <span id="zoomLevel">
                100%
            </span>

        </button>



        <!-- ZOOM IN -->

        <button
            id="zoomInButton"
            class="control-button icon-button"
            type="button"
            title="Zoom in"
        >

            <i class="fas fa-plus"></i>

        </button>



        <!-- BOOKMARK -->

        <button
            id="bookmarkBtn"
            class="control-button icon-button"
            type="button"
            title="Bookmark page"
            aria-label="Bookmark page"
        >

            <i class="far fa-bookmark"></i>

        </button>



        <!-- SHARE -->

        <button
            id="shareBtn"
            class="control-button icon-button"
            type="button"
            title="Share"
            aria-label="Share"
        >

            <i class="fas fa-share-nodes"></i>

        </button>



        <!-- THEME -->

        <button
            id="themeButton"
            class="control-button icon-button"
            type="button"
            title="Change theme"
            aria-label="Change theme"
        >

            <i class="fas fa-palette"></i>

        </button>



        <!-- READ -->

        <button
            id="listenButton"
            class="control-button"
            type="button"
            title="Read aloud"
        >

            <i class="fas fa-volume-high"></i>

            <span class="button-label">
                Listen
            </span>

        </button>



        <!-- PAUSE -->

        <button
            id="pauseListenButton"
            class="control-button icon-button"
            type="button"
            title="Pause"
            disabled
        >

            <i class="fas fa-pause"></i>

        </button>



        <!-- STOP -->

        <button
            id="stopListenButton"
            class="control-button icon-button"
            type="button"
            title="Stop"
            disabled
        >

            <i class="fas fa-stop"></i>

        </button>



        <!-- SPEED -->

        <select
            id="listenSpeed"
            title="Reading speed"
            aria-label="Reading speed"
        >

            <option value="0.7">
                0.7×
            </option>

            <option value="0.85">
                0.85×
            </option>

            <option
                value="1"
                selected
            >
                1×
            </option>

            <option value="1.15">
                1.15×
            </option>

            <option value="1.3">
                1.3×
            </option>

            <option value="1.5">
                1.5×
            </option>

        </select>



        <!-- DOWNLOAD -->

        <button
            id="downloadButton"
            class="control-button"
            type="button"
            title="Download watermarked PDF"
        >

            <i class="fas fa-download"></i>

            <span class="button-label">
                Download
            </span>

        </button>



        <!-- PRINT -->

        <button
            id="printButton"
            class="control-button icon-button"
            type="button"
            title="Print"
        >

            <i class="fas fa-print"></i>

        </button>



        <!-- FULLSCREEN -->

        <button
            id="fullscreenButton"
            class="control-button icon-button"
            type="button"
            title="Fullscreen"
        >

            <i class="fas fa-expand"></i>

        </button>


    </nav>



    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div
        id="readerStatus"
        class="reader-status"
        aria-live="polite"
    >
        Ready
    </div>


</main>


<!-- =========================================================
     READER JS
========================================================== -->

<script
    type="module"
    src="./reader.js"
></script>


</body>
</html>
