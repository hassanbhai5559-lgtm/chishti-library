<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ChishtiLibrary.com Digital Book Reader"
    >

    <title>Chishti Reader — ChishtiLibrary.com</title>

    <!-- Reader CSS -->
    <link rel="stylesheet" href="./reader.css">
</head>

<body>

    <!-- =====================================================
         CHISHTI READER
         Main Application
         ===================================================== -->

    <main
        id="readerApp"
        class="reader-app"
        aria-label="ChishtiLibrary PDF Reader"
    >

        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="reader-header">

            <div class="reader-brand">
                <span class="reader-brand__name">
                    ChishtiLibrary.com
                </span>

                <span class="reader-brand__title">
                    Chishti Reader
                </span>
            </div>

            <div
                id="bookTitle"
                class="reader-book-title"
            >
                Loading book...
            </div>

        </header>


        <!-- =================================================
             READER AREA
             ================================================= -->

        <section
            class="reader-area"
            aria-label="Book reading area"
        >

            <!-- Loading Screen -->

            <div
                id="loadingScreen"
                class="loading-screen"
                role="status"
                aria-live="polite"
            >

                <div class="loading-spinner"></div>

                <p id="loadingText">
                    Loading book...
                </p>

                <span id="loadingProgress">
                    0%
                </span>

            </div>


            <!-- Book Container -->

            <div
                id="bookContainer"
                class="book-container"
            >

                <!-- Watermark -->

                <div
                    class="book-watermark"
                    aria-hidden="true"
                >
                    ChishtiLibrary.com
                </div>


                <!-- PDF Page -->

                <div
                    id="pageWrapper"
                    class="page-wrapper"
                >

                    <canvas
                        id="pdfCanvas"
                        aria-label="Current PDF page"
                    ></canvas>

                </div>

            </div>

        </section>


        <!-- =================================================
             READER CONTROLS
             ================================================= -->

        <nav
            class="reader-controls"
            aria-label="Reader controls"
        >

            <!-- Previous Page -->

            <button
                id="previousPageButton"
                type="button"
                class="reader-button"
                title="Previous page"
                aria-label="Go to previous page"
            >
                ← Previous
            </button>


            <!-- Page Counter -->

            <div
                class="page-counter"
                aria-label="Page navigation"
            >

                <label
                    for="pageNumberInput"
                    class="sr-only"
                >
                    Page number
                </label>

                <input
                    id="pageNumberInput"
                    class="page-number-input"
                    type="number"
                    min="1"
                    value="1"
                    inputmode="numeric"
                    aria-label="Current page number"
                >

                <span aria-hidden="true">
                    /
                </span>

                <span
                    id="totalPages"
                    aria-label="Total pages"
                >
                    0
                </span>

            </div>


            <!-- Next Page -->

            <button
                id="nextPageButton"
                type="button"
                class="reader-button"
                title="Next page"
                aria-label="Go to next page"
            >
                Next →
            </button>


            <!-- Zoom Controls -->

            <div
                class="zoom-controls"
                aria-label="Zoom controls"
            >

                <button
                    id="zoomOutButton"
                    type="button"
                    class="reader-button reader-button--small"
                    title="Zoom out"
                    aria-label="Zoom out"
                >
                    −
                </button>

                <button
                    id="resetZoomButton"
                    type="button"
                    class="reader-button reader-button--zoom"
                    title="Reset zoom"
                    aria-label="Reset zoom"
                >
                    <span id="zoomLevel">
                        100%
                    </span>
                </button>

                <button
                    id="zoomInButton"
                    type="button"
                    class="reader-button reader-button--small"
                    title="Zoom in"
                    aria-label="Zoom in"
                >
                    +
                </button>

            </div>

        </nav>


        <!-- =================================================
             SCREEN READER STATUS
             ================================================= -->

        <div
            id="readerStatus"
            class="sr-only"
            role="status"
            aria-live="polite"
        ></div>

    </main>


    <!-- =====================================================
         PDF.JS
         ===================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
        type="module"
    ></script>


    <!-- =====================================================
         READER JAVASCRIPT
         ===================================================== -->

    <script
        src="./reader.js"
        type="module"
    ></script>

</body>
</html>
