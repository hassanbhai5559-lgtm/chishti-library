<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<meta name="theme-color"
content="#111827">

<meta name="description"
content="Chishti Library Professional PDF Reader">

<title>

Chishti Library Reader

</title>

<!-- Google Fonts -->

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<!-- Remix Icons -->

<link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
rel="stylesheet">

<!-- Reader CSS -->

<link rel="stylesheet"
href="reader.css">

<!-- PDF.js -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

</script>

</head>

<body>

<!-- Opening Screen -->

<div id="openingScreen">

<div class="logo">

📚

</div>

<h1>

CHISHTI LIBRARY

</h1>

<p>

Opening Your Book...

</p>

</div>

<!-- Loader -->

<div id="loadingScreen">

<div class="loader">

<div class="spinner"></div>

<h2 id="loadingText">

Loading Book...

</h2>

<div class="progress">

<div id="loadingBar"></div>

</div>

<div id="loadingPercent">

0%

</div>

</div>

</div>

<!-- Toast -->

<div id="toast"></div>

<!-- Main Reader -->

<div id="reader">

<header id="readerHeader">

<div class="leftHeader">

<h2 id="bookTitle">

Untitled Book

</h2>

<p id="bookAuthor">

Unknown Author

</p>

</div>

<div class="rightHeader">

<button id="searchBtn">

<i class="ri-search-line"></i>

</button>

<button id="bookmarkBtn">

<i class="ri-bookmark-line"></i>

</button>

<button id="themeBtn">

<i class="ri-moon-line"></i>

</button>

<button id="fullscreenBtn">

<i class="ri-fullscreen-line"></i>

</button>

</div>

</header>

<main id="readerBody">

<div id="pdfContainer">

<canvas id="pdfCanvas"></canvas>

<div id="pageFlipLayer"></div>

</div>
<!--==========================================
            LEFT SIDEBAR
===========================================-->

<aside id="leftSidebar">

<div class="sidebarHeader">

<h3>

Contents

</h3>

<button id="closeSidebar">

<i class="ri-close-line"></i>

</button>

</div>

<div id="tocContainer">

</div>

<hr>

<h3>

Bookmarks

</h3>

<div id="bookmarkContainer">

</div>

</aside>

<!--==========================================
            SEARCH PANEL
===========================================-->

<div id="searchPanel">

<div class="searchHeader">

<input

type="text"

id="searchInput"

placeholder="Search in book...">

<button id="searchClose">

<i class="ri-close-line"></i>

</button>

</div>

<div id="searchResults">

</div>

</div>

<!--==========================================
            THUMBNAILS
===========================================-->

<div id="thumbnailSidebar">

<div class="thumbnailHeader">

<h3>

Pages

</h3>

</div>

<div id="thumbnailContainer">

</div>

</div>

<!--==========================================
            COMMENTS
===========================================-->

<div id="commentPanel">

<div class="commentHeader">

<h3>

Comments

</h3>

</div>

<div id="commentList">

</div>

<div class="commentForm">

<input

type="text"

id="commentName"

placeholder="Your Name">

<textarea

id="commentMessage"

placeholder="Write comment...">

</textarea>

<button id="commentSubmit">

Post Comment

</button>

</div>

</div>

<!--==========================================
            SETTINGS
===========================================-->

<div id="settingsPanel">

<h3>

Reader Settings

</h3>

<div class="settingItem">

<label>

Dark Mode

</label>

<input

type="checkbox"

id="darkMode">

</div>

<div class="settingItem">

<label>

Page Shadow

</label>

<input

type="checkbox"

id="pageShadow"

checked>

</div>

<div class="settingItem">

<label>

Page Animation

</label>

<input

type="checkbox"

id="pageAnimation"

checked>

</div>

<div class="settingItem">

<label>

Auto Save

</label>

<input

type="checkbox"

id="autoSave"

checked>

</div>

</div>
<!--==========================================
            READER TOOLBAR
===========================================-->

<div id="readerToolbar">

    <button id="menuBtn" title="Menu">
        <i class="ri-menu-line"></i>
    </button>

    <button id="prevBtn" title="Previous Page">
        <i class="ri-arrow-left-line"></i>
    </button>

    <div id="pageCounter">
        <span id="currentPage">1</span>
        <span>/</span>
        <span id="totalPages">0</span>
    </div>

    <button id="nextBtn" title="Next Page">
        <i class="ri-arrow-right-line"></i>
    </button>

    <div class="toolbarDivider"></div>

    <button id="zoomOutBtn" title="Zoom Out">
        <i class="ri-zoom-out-line"></i>
    </button>

    <span id="zoomValue">
        100%
    </span>

    <button id="zoomInBtn" title="Zoom In">
        <i class="ri-zoom-in-line"></i>
    </button>

    <button id="fitBtn" title="Fit Page">
        <i class="ri-expand-diagonal-line"></i>
    </button>

    <div class="toolbarDivider"></div>

    <button id="thumbnailBtn" title="Thumbnails">
        <i class="ri-layout-grid-line"></i>
    </button>

    <button id="commentsBtn" title="Comments">
        <i class="ri-chat-3-line"></i>
    </button>

</div>


<!--==========================================
            READING PROGRESS
===========================================-->

<div id="readingProgress">

    <div id="readingProgressFill"></div>

</div>


<!--==========================================
            BOTTOM BAR
===========================================-->

<footer id="readerFooter">

    <div class="footerLeft">

        <span id="pageInfo">
            Page 1 of 0
        </span>

    </div>

    <div class="footerCenter">

        <button
            id="previousPage"
            title="Previous">

            <i class="ri-arrow-left-s-line"></i>

        </button>

        <button
            id="nextPage"
            title="Next">

            <i class="ri-arrow-right-s-line"></i>

        </button>

    </div>

    <div class="footerRight">

        <button
            id="likeBtn"
            title="Like Book">

            <i class="ri-heart-line"></i>

            <span id="likeCount">
                0
            </span>

        </button>

        <button
            id="shareBtn"
            title="Share">

            <i class="ri-share-line"></i>

        </button>

    </div>

</footer>


<!--==========================================
            SHARE PANEL
===========================================-->

<div id="sharePanel">

    <div class="shareBox">

        <button
            id="shareClose"
            class="closeButton">

            <i class="ri-close-line"></i>

        </button>

        <h3>
            Share Book
        </h3>

        <div class="shareButtons">

            <button id="copyLinkBtn">
                <i class="ri-link"></i>
                Copy Link
            </button>

            <button id="nativeShareBtn">
                <i class="ri-share-forward-line"></i>
                Share
            </button>

        </div>

    </div>

</div>


<!--==========================================
            BOOKMARK MESSAGE
===========================================-->

<div id="bookmarkMessage"></div>


<!--==========================================
            FILE INPUT
===========================================-->

<input
    type="file"
    id="pdfInput"
    accept="application/pdf"
    hidden>


<!--==========================================
            JAVASCRIPT
===========================================-->

<script src="reader.js"></script>


<!--==========================================
            END READER
===========================================-->

</main>

</div>

</body>

</html>
