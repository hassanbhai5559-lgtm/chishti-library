<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ChishtiLibrary.com Premium Digital Book Reader"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>Chishti Reader — ChishtiLibrary.com</title>


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================================
         READER CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./reader.css"
    >

</head>


<body>

    <!-- =====================================================
         MAIN READER
    ====================================================== -->

    <main
        id="readerApp"
        class="reader-app"
        aria-label="ChishtiLibrary digital book reader"
    >


        <!-- =================================================
             HEADER
        ================================================== -->

        <header
            id="readerHeader"
            class="reader-header"
        >

            <div class="reader-brand">

                <div class="reader-brand-name">
                    ChishtiLibrary.com
                </div>

                <div class="reader-brand-title">
                    CHISHTI READER
                </div>

            </div>


            <h1
                id="bookTitle"
                class="book-title"
            >
                Digital Book
            </h1>

        </header>


        <!-- =================================================
             READER AREA
        ================================================== -->

        <section
            id="readerArea"
            class="reader-area"
            aria-label="Book page"
        >

            <div
                id="bookViewport"
                class="book-viewport"
            >

                <div
                    id="pageWrapper"
                    class="page-wrapper"
                >

                    <canvas
                        id="pdfCanvas"
                        aria-label="Current book page"
                    ></canvas>


                    <!-- Watermark shown while reading -->

                    <div
                        id="pageWatermark"
                        class="page-watermark"
                        aria-hidden="true"
                    >
                        ChishtiLibrary.com
                    </div>

                </div>

            </div>


            <!-- =================================================
                 ERROR SCREEN
            ================================================== -->

            <div
                id="errorScreen"
                class="error-screen"
                hidden
            >

                <div class="error-icon">
                    ⚠
                </div>

                <h2>
                    Unable to open book
                </h2>

                <p id="errorMessage">
                    The selected PDF could not be loaded.
                </p>

                <button
                    id="retryButton"
                    class="error-retry-button"
                    type="button"
                >
                    Try Again
                </button>

            </div>

        </section>


        <!-- =================================================
             READER CONTROLS
        ================================================== -->

        <nav
            id="readerControls"
            class="reader-controls"
            aria-label="Book controls"
        >


         <!-- =========================
     READER SEARCH
========================= -->

<div class="reader-search">

    <div class="reader-search-box">

        <span
            class="reader-search-icon"
            aria-hidden="true"
        >
            🔎
        </span>

        <input
            type="search"
            id="readerSearchInput"
            placeholder="Search books, authors, categories..."
            autocomplete="off"
            aria-label="Search books, authors, and categories"
        >

        <button
            type="button"
            id="readerSearchClear"
            class="reader-search-clear"
            aria-label="Clear search"
            title="Clear search"
        >
            ✕
        </button>

        <!-- SEARCH BUTTON -->
        <button
            type="button"
            id="readerSearchButton"
            class="reader-search-button"
            aria-label="Search"
            title="Search"
        >
            <i
                class="fas fa-search"
                aria-hidden="true"
            ></i>

            <span>
                Search
            </span>
        </button>

    </div>

    <div
        id="readerSearchResults"
        class="reader-search-results"
        role="listbox"
        aria-label="Search results"
    ></div>

</div>
            <!-- =================================================
                 PREVIOUS
            ================================================== -->

            <button
                id="previousPageButton"
                class="control-button"
                type="button"
                title="Previous page"
                aria-label="Previous page"
            >

                <span aria-hidden="true">
                    ←
                </span>

                <span class="button-label">
                    Previous
                </span>

            </button>


            <!-- =================================================
                 PAGE COUNTER
            ================================================== -->

            <div
                class="page-counter"
                aria-label="Page counter"
            >

                <label
                    for="pageNumberInput"
                    class="sr-only"
                >
                    Current page
                </label>

                <input
                    id="pageNumberInput"
                    class="page-number-input"
                    type="number"
                    min="1"
                    value="1"
                    inputmode="numeric"
                    aria-label="Current page"
                >

                <span aria-hidden="true">
                    /
                </span>

                <span
                    id="totalPages"
                    class="total-pages"
                >
                    0
                </span>

            </div>


            <!-- =================================================
                 NEXT
            ================================================== -->

            <button
                id="nextPageButton"
                class="control-button"
                type="button"
                title="Next page"
                aria-label="Next page"
            >

                <span class="button-label">
                    Next
                </span>

                <span aria-hidden="true">
                    →
                </span>

            </button>


            <!-- =================================================
                 BOOKMARK
            ================================================== -->

            <button
                id="bookmarkBtn"
                class="control-button icon-button"
                type="button"
                title="Bookmark current page"
                aria-label="Bookmark current page"
            >

                <i
                    class="far fa-bookmark"
                    aria-hidden="true"
                ></i>

            </button>


            <!-- =================================================
                 SHARE
            ================================================== -->

            <button
                id="shareBtn"
                class="control-button icon-button"
                type="button"
                title="Share this page"
                aria-label="Share this page"
            >

                <i
                    class="fas fa-share-nodes"
                    aria-hidden="true"
                ></i>

            </button>


            <!-- =================================================
                 DIVIDER
            ================================================== -->

            <span
                class="control-divider"
                aria-hidden="true"
            ></span>


            <!-- =================================================
                 ZOOM OUT
            ================================================== -->

            <button
                id="zoomOutButton"
                class="control-button zoom-button"
                type="button"
                title="Zoom out"
                aria-label="Zoom out"
            >
                −
            </button>


            <!-- =================================================
                 ZOOM LEVEL
            ================================================== -->

            <button
                id="resetZoomButton"
                class="control-button zoom-level"
                type="button"
                title="Reset zoom"
                aria-label="Reset zoom"
            >

                <span id="zoomLevel">
                    100%
                </span>

            </button>


            <!-- =================================================
                 ZOOM IN
            ================================================== -->

            <button
                id="zoomInButton"
                class="control-button zoom-button"
                type="button"
                title="Zoom in"
                aria-label="Zoom in"
            >
                +
            </button>


            <!-- =================================================
                 DIVIDER
            ================================================== -->

            <span
                class="control-divider"
                aria-hidden="true"
            ></span>


            <!-- =================================================
                 THEME
            ================================================== -->

            <button
                id="themeButton"
                class="control-button"
                type="button"
                title="Change theme"
                aria-label="Change reader theme"
            >
                ◐
            </button>


            <!-- =================================================
                 FULLSCREEN
            ================================================== -->

            <button
                id="fullscreenButton"
                class="control-button"
                type="button"
                title="Fullscreen"
                aria-label="Fullscreen"
            >
                ⛶
            </button>


            <!-- =================================================
                 PRINT
            ================================================== -->

            <button
                id="printButton"
                class="control-button"
                type="button"
                title="Print book"
                aria-label="Print book"
            >
                🖨
            </button>


            <!-- =================================================
                 WATERMARKED DOWNLOAD
            ================================================== -->

            <button
                id="downloadButton"
                class="control-button"
                type="button"
                title="Download with watermark"
                aria-label="Download with watermark"
            >
                ↓
            </button>


            <!-- =================================================
                 SUBSCRIBER DOWNLOAD
            ================================================== -->

            <button
                id="cleanDownloadButton"
                class="control-button premium-button"
                type="button"
                title="Subscriber clean download"
                aria-label="Subscriber clean download"
            >
                ★
            </button>

        </nav>


        <!-- =================================================
             STATUS
        ================================================== -->

        <div
            id="readerStatus"
            class="sr-only"
            role="status"
            aria-live="polite"
        ></div>

    </main>


    <!-- =====================================================
         PDF.JS
    ====================================================== -->

    <script
        type="module"
        src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
    ></script>


    <!-- =====================================================
         PDF-LIB
         Used for watermark PDF generation
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"
    ></script>


    <!-- =====================================================
         CHISHTI READER JS
    ====================================================== -->

    <script
        type="module"
        src="./reader.js"
    ></script>


</body>

</html>
