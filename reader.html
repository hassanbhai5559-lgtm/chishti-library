<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Chishti Reader</title>

<link rel="stylesheet" href="reader.css">

</head>

<body>

<div id="reader">

<header class="topbar">

<div class="logo">
📖 CHISHTI READER
</div>

<div class="book-title">
Loading...
</div>

<div class="actions">

<button id="bookmarkBtn">★</button>

<button id="settingBtn">⚙</button>

<button id="closeBtn">✕</button>

</div>

</header>


<nav class="toolbar">

<button id="prevPage">◀</button>

<div id="pageInfo">

1 / 1

</div>

<button id="nextPage">▶</button>

<input
type="text"
id="searchBox"
placeholder="Search">

<button id="zoomOut">−</button>

<button id="zoomIn">+</button>

</nav>


<main id="viewer">

<div id="book">

<canvas id="pageCanvas"></canvas>

<div id="watermark">
CHISHTI LIBRARY
</div>

</div>

</main>

</div>

<script src="reader.js"></script>

</body>
</html>
