<!DOCTYPE html>
<html lang="en" data-theme="maroon">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CHISHTI READER PRO</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="reader.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.js"></script>

<script defer
src="reader.js"></script>

</head>

<body>

<div id="readerApp"
class="reader-app">

    <!-- Background -->

    <div class="reader-background">

        <div class="bg-glow glow-left"></div>

        <div class="bg-glow glow-right"></div>

        <div class="bg-pattern"></div>

    </div>

    <!-- Header -->

    <header class="reader-header">

        <div class="header-left">

            <img
            src="assets/logo.png"
            alt="Logo"
            class="reader-logo">

            <div>

                <h1>

                    CHISHTI READER

                </h1>

                <span>

                    Professional Islamic Reader

                </span>

            </div>

        </div>

        <div class="header-center">

            <div class="search-box">

                <i
                class="ri-search-line"></i>

                <input

                id="searchInput"

                type="text"

                placeholder="Search inside book...">

            </div>

        </div>

        <div class="header-right">

            <button

            id="themeButton"

            class="icon-button"

            title="Theme">

                🎨

            </button>

            <button

            id="bookmarkButton"

            class="icon-button"

            title="Bookmarks">

                🔖

            </button>

            <button

            id="settingButton"

            class="icon-button"

            title="Settings">

                ⚙

            </button>

            <button

            id="fullscreenButton"

            class="icon-button"

            title="Fullscreen">

                ⛶

            </button>

        </div>

    </header>

    <!-- Reader -->

    <main
    class="reader-stage">

        <div
        class="book-stage">

            <!-- Book Shadow -->

            <div
            class="book-shadow">

            </div>

            <!-- Book -->

            <div
            id="book"

            class="real-book">

                <!-- Left -->

                <section
                class="page page-left">

                    <canvas

                    id="leftCanvas">

                    </canvas>

                </section>

                <!-- Spine -->

                <div
                class="book-spine">

                </div>

                <!-- Right -->

                <section
                class="page page-right">

                    <canvas

                    id="rightCanvas">

                    </canvas>

                </section>

            </div>

        </div>

    </main>

    <!-- Bottom Toolbar -->

    <footer
    class="reader-toolbar">

        <button
        id="firstPage">

            ⏮

        </button>

        <button
        id="previousPage">

            ◀

        </button>

        <div
        class="page-box">

            <input

            id="pageNumber"

            type="number"

            value="1">

            <span>

                /

            </span>

            <span
            id="totalPages">

                0

            </span>

        </div>

        <button
        id="nextPage">

            ▶

        </button>

        <button
        id="lastPage">

            ⏭

        </button>

        <button
        id="zoomOut">

            −

        </button>

        <button
        id="zoomIn">

            +

        </button>

        <button
        id="rotateBook">

            ↻

        </button>

    </footer>

</div>

</body>

</html>
