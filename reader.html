<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Chishti Reader Pro</title>

<meta name="description" content="Professional Reader by Chishti Library">

<meta name="theme-color" content="#0b6b3a">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="reader.css">

</head>

<body>

<!-- Loader -->

<div id="loading">

<div class="loader"></div>

<h2>Opening Chishti Reader...</h2>

<p>Please wait...</p>

</div>

<!-- Main Reader -->

<div id="readerApp">

<!-- Header -->

<header class="topbar">

<div class="left-header">

<button id="menuBtn">

<i class="fa-solid fa-bars"></i>

</button>

<div class="brand">

<i class="fa-solid fa-book-quran"></i>

<span>Chishti Reader Pro</span>

</div>

</div>

<div class="book-title" id="bookTitle">

Loading Book...

</div>

<div class="right-header">

<button id="themeBtn">

<i class="fa-solid fa-moon"></i>

</button>

<button id="fullscreenBtn">

<i class="fa-solid fa-expand"></i>

</button>

<button id="homeBtn">

<i class="fa-solid fa-house"></i>

</button>

</div>

</header>

<!-- Content -->

<div class="content">

<!-- Sidebar -->

<aside id="sidebar">

<div class="sidebar-header">

<h3>

<i class="fa-solid fa-bookmark"></i>

Library

</h3>

</div>

<div class="search-box">

<input

type="text"

id="searchInput"

placeholder="Search page...">

<button id="searchBtn">

<i class="fa-solid fa-search"></i>

</button>

</div>

<div id="thumbnailContainer">

<!-- JS -->

</div>

</aside>

<!-- Reader -->

<main class="reader-area">

<div class="book-stage">

<div class="book-shadow"></div>

<div class="book-container">

<canvas id="pdfCanvas"></canvas>

</div>

</div>

</main>

</div>
<!-- Bottom Toolbar -->

<footer class="toolbar">

<div class="toolbar-left">

<button id="prevPage" title="Previous Page">

<i class="fa-solid fa-chevron-left"></i>

</button>

<button id="nextPage" title="Next Page">

<i class="fa-solid fa-chevron-right"></i>

</button>

</div>

<div class="toolbar-center">

<button id="zoomOut" title="Zoom Out">

<i class="fa-solid fa-magnifying-glass-minus"></i>

</button>

<div class="page-info">

<input

type="number"

id="pageNumber"

value="1"

min="1">

<span>/</span>

<span id="totalPages">0</span>

</div>

<button id="zoomIn" title="Zoom In">

<i class="fa-solid fa-magnifying-glass-plus"></i>

</button>

</div>

<div class="toolbar-right">

<button id="bookmarkBtn" title="Bookmark">

<i class="fa-solid fa-bookmark"></i>

</button>

<button id="rotateBtn" title="Rotate">

<i class="fa-solid fa-rotate-right"></i>

</button>

<button id="printBtn" title="Print">

<i class="fa-solid fa-print"></i>

</button>

<button id="downloadBtn" title="Download">

<i class="fa-solid fa-download"></i>

</button>

</div>

</footer>

<!-- Reading Progress -->

<div class="progress-wrapper">

<div id="readingProgress"></div>

</div>

<!-- Status Bar -->

<div class="status-bar">

<div>

<i class="fa-solid fa-book-open"></i>

<span id="statusBook">

Book Loaded

</span>

</div>

<div>

<i class="fa-solid fa-clock"></i>

<span id="readingTime">

00:00

</span>

</div>

<div>

<i class="fa-solid fa-file-lines"></i>

<span>

Page

<span id="currentPage">

1

</span>

of

<span id="pagesCount">

0

</span>

</span>

</div>

</div>

<!-- Bookmark Popup -->

<div id="bookmarkPopup" class="popup">

<div class="popup-box">

<h3>

Save Bookmark

</h3>

<input

type="text"

id="bookmarkTitle"

placeholder="Bookmark Name">

<div class="popup-buttons">

<button id="saveBookmark">

Save

</button>

<button id="closeBookmark">

Cancel

</button>

</div>

</div>

</div>

<!-- Search Result -->

<div id="searchResult"></div>

<!-- Scripts -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>

<script src="pdf-engine.js"></script>

<script src="reader.js"></script>

<script src="animations.js"></script>

<script src="thumbnails.js"></script>

<script src="search.js"></script>

<script src="bookmarks.js"></script>

<script src="page-engine.js"></script>

</body>

</html>
