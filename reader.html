<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Chishti Reader</title>

<!-- CSS -->

<link
rel="stylesheet"
href="reader.css">

<!-- Google Font -->

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<!-- Icons -->

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- PDF.js -->

<script
src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
</script>

</head>

<body>

<!--==================================================
BACKGROUND
===================================================-->

<div class="reader-background">

    <div class="bg-overlay"></div>

    <div class="bg-pattern"></div>

</div>

<!--==================================================
PRELOADER
===================================================-->

<div id="preloader" class="preloader">

    <div class="loader-book">

        <div class="loader-page"></div>

        <div class="loader-page"></div>

        <div class="loader-page"></div>

    </div>

    <h2>

        CHISHTI READER

    </h2>

    <span>

        Loading Book...

    </span>

</div>

<!--==================================================
MAIN APPLICATION
===================================================-->

<div id="readerApp" class="reader-app">

 <!--==================================================
PREMIUM TOP TOOLBAR
PART 2
===================================================-->

<header class="reader-toolbar">

    <!--==============================
    LEFT
    ==============================-->

    <div class="toolbar-left">

        <button
        id="menuBtn"
        class="tool-btn">

            <i class="fas fa-bars"></i>

        </button>

        <div class="reader-brand">

            <div class="reader-logo">

                <img
                src="logo.png"
                alt="Chishti Library">

            </div>

            <div class="reader-title">

                <h2>

                    CHISHTI READER

                </h2>

                <span>

                    Premium Islamic Digital Library

                </span>

            </div>

        </div>

    </div>

    <!--==============================
    CENTER
    ==============================-->

    <div class="toolbar-center">

        <div class="current-book">

            <i class="fas fa-book-open"></i>

            <span id="bookTitle">

                Loading Book...

            </span>

        </div>

    </div>

    <!--==============================
    RIGHT
    ==============================-->

    <div class="toolbar-right">

        <button
        id="bookmarkBtn"
        class="tool-btn"
        title="Bookmark">

            <i class="fas fa-bookmark"></i>

        </button>

        <button
        id="searchBtn"
        class="tool-btn"
        title="Search">

            <i class="fas fa-search"></i>

        </button>

        <button
        id="themeBtn"
        class="tool-btn"
        title="Theme">

            <i class="fas fa-moon"></i>

        </button>

        <button
        id="settingsBtn"
        class="tool-btn"
        title="Settings">

            <i class="fas fa-gear"></i>

        </button>

    </div>

</header>

<!--==================================================
BOOK STAGE
PART 3
===================================================-->

<main class="reader-stage">

    <!-- Left Glow -->

    <div class="book-glow left-glow"></div>

    <!-- Right Glow -->

    <div class="book-glow right-glow"></div>

    <!-- Book Shadow -->

    <div class="book-shadow"></div>

    <!--==============================
    BOOK
    ==============================-->

    <section
    id="readerBook"
    class="book">

        <!--==============================
        LEFT PAGE
        ==============================-->

        <article
        class="page left-page">

            <div class="page-surface">

                <canvas
                id="leftCanvas">
                </canvas>

            </div>

            <div class="page-light"></div>

        </article>

        <!--==============================
        BOOK SPINE
        ==============================-->

        <div class="book-spine">

            <div class="spine-shadow"></div>

            <div class="spine-highlight"></div>

            <div class="spine-line"></div>

        </div>

        <!--==============================
        RIGHT PAGE
        ==============================-->

        <article
        class="page right-page">

            <div class="page-surface">

                <canvas
                id="rightCanvas">
                </canvas>

            </div>

            <div class="page-light"></div>

        </article>

    </section>

</main>

<!--==================================================
PREMIUM BOTTOM TOOLBAR
PART 4
===================================================-->

<footer class="reader-bottom">

    <!--==============================
    LEFT TOOLS
    ==============================-->

    <div class="bottom-group">

        <button
        id="firstPage"
        class="reader-btn"
        title="First Page">

            <i class="fas fa-backward-fast"></i>

        </button>

        <button
        id="prevPage"
        class="reader-btn"
        title="Previous Page">

            <i class="fas fa-chevron-left"></i>

        </button>

    </div>

    <!--==============================
    PAGE COUNTER
    ==============================-->

    <div class="page-display">

        <span
        id="pageCounter">

            1 - 2

        </span>

        <span class="page-divider">

            /

        </span>

        <span
        id="totalPages">

            0

        </span>

    </div>

    <!--==============================
    RIGHT TOOLS
    ==============================-->

    <div class="bottom-group">

        <button
        id="zoomOut"
        class="reader-btn"
        title="Zoom Out">

            <i class="fas fa-search-minus"></i>

        </button>

        <button
        id="zoomIn"
        class="reader-btn"
        title="Zoom In">

            <i class="fas fa-search-plus"></i>

        </button>

        <button
        id="downloadBtn"
        class="reader-btn"
        title="Download PDF">

            <i class="fas fa-download"></i>

        </button>

        <button
        id="printBtn"
        class="reader-btn"
        title="Print Book">

            <i class="fas fa-print"></i>

        </button>

        <button
        id="fullscreenBtn"
        class="reader-btn"
        title="Fullscreen">

            <i class="fas fa-expand"></i>

        </button>

        <button
        id="nextPage"
        class="reader-btn"
        title="Next Page">

            <i class="fas fa-chevron-right"></i>

        </button>

        <button
        id="lastPage"
        class="reader-btn"
        title="Last Page">

            <i class="fas fa-forward-fast"></i>

        </button>

    </div>

</footer>

<!--==================================================
PREMIUM SEARCH POPUP
PART 5
===================================================-->

<div id="searchOverlay" class="search-overlay">

    <div class="search-window">

        <div class="window-header">

            <h3>

                <i class="fas fa-search"></i>

                Search Book

            </h3>

            <button
            id="closeSearch"
            class="window-close">

                <i class="fas fa-times"></i>

            </button>

        </div>

        <div class="search-input-box">

            <input
            id="searchInput"
            type="text"
            placeholder="Search inside this book...">

            <button
            id="startSearch">

                <i class="fas fa-search"></i>

            </button>

        </div>

        <div
        id="searchResults"
        class="search-results">

        </div>

    </div>

</div>

<!--==================================================
PREMIUM SETTINGS
===================================================-->

<div id="settingsOverlay" class="settings-overlay">

    <div class="settings-window">

        <div class="window-header">

            <h3>

                <i class="fas fa-gear"></i>

                Reader Settings

            </h3>

            <button
            id="closeSettings"
            class="window-close">

                <i class="fas fa-times"></i>

            </button>

        </div>

        <div class="settings-body">

            <div class="setting-row">

                <label>

                    Theme

                </label>

                <select id="themeSelect">

                    <option value="maroon">

                        Maroon Gold

                    </option>

                    <option value="dark">

                        Dark

                    </option>

                    <option value="light">

                        Light

                    </option>

                    <option value="sepia">

                        Sepia

                    </option>

                </select>

            </div>

            <div class="setting-row">

                <label>

                    Default Zoom

                </label>

                <input
                id="defaultZoom"
                type="range"
                min="1"
                max="3"
                step="0.1"
                value="1.5">

            </div>

            <div class="setting-row">

                <label>

                    Page Animation

                </label>

                <input
                id="animationSwitch"
                type="checkbox"
                checked>

            </div>

            <div class="setting-row">

                <label>

                    Continue Reading

                </label>

                <input
                id="continueSwitch"
                type="checkbox"
                checked>

            </div>

        </div>

        <div class="window-footer">

            <button
            id="saveSettings">

                Save Settings

            </button>

        </div>

    </div>

</div>

<!--==================================================
BOOKMARK PANEL
===================================================-->

<div id="bookmarkOverlay" class="bookmark-overlay">

    <div class="bookmark-window">

        <div class="window-header">

            <h3>

                <i class="fas fa-bookmark"></i>

                Bookmarks

            </h3>

            <button
            id="closeBookmark"
            class="window-close">

                <i class="fas fa-times"></i>

            </button>

        </div>

        <div
        id="bookmarkList"
        class="bookmark-list">

            <div class="empty-bookmark">

                No Bookmarks

            </div>

        </div>

    </div>

</div>

<!--==================================================
PREMIUM TOAST
PART 6
===================================================-->

<div id="toast" class="toast">

    <i class="fas fa-circle-check"></i>

    <span id="toastMessage">

        Done

    </span>

</div>

<!--==================================================
FLOATING LOADER
===================================================-->

<div id="loadingBar" class="loading-bar">

    <div id="loadingProgress"
    class="loading-progress">

    </div>

</div>

<!--==================================================
PDF LOADING SCREEN
===================================================-->

<div id="pdfLoading"
class="pdf-loading">

    <div class="pdf-loader">

        <div class="loader-ring"></div>

        <div class="loader-ring"></div>

        <div class="loader-ring"></div>

    </div>

    <h2>

        Preparing Book...

    </h2>

    <p>

        Optimizing Pages

    </p>

</div>

<!--==================================================
SCREEN DIMMER
===================================================-->

<div id="screenDimmer"
class="screen-dimmer">

</div>

<!--==================================================
JAVASCRIPT
===================================================-->

<script src="reader.js"></script>

</div>

</body>

</html>
