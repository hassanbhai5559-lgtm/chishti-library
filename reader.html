<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Chishti Reader — A premium digital book reader."
    >

    <title>Chishti Reader</title>

    <!-- =====================================================
         CHISHTI READER CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./reader.css"
    >

</head>


<body>

    <!-- =====================================================
         CHISHTI READER
         BASE APPLICATION
    ====================================================== -->

    <main
        id="chishtiReader"
        class="chishti-reader"
    >

        <!-- =================================================
             HEADER
        ================================================== -->

        <header
            id="readerHeader"
            class="reader-header"
        >

            <div
                class="reader-brand"
            >

                <h1>
                    Chishti Reader
                </h1>

            </div>

        </header>


        <!-- =================================================
             READER AREA
        ================================================== -->

        <section
            id="readerContent"
            class="reader-content"
            aria-label="Book reader"
        >

            <div
                id="readerPages"
                class="reader-pages"
            >

                <!-- PDF pages will be rendered here -->

            </div>

        </section>


        <!-- =================================================
             NAVIGATION
        ================================================== -->

        <nav
            id="readerNavigation"
            class="reader-navigation"
            aria-label="Reader navigation"
        >

            <button
                id="previousPage"
                type="button"
            >
                ← Previous Page
            </button>


            <div
                id="readerPageCounter"
                class="reader-page-counter"
            >

                <input
                    id="pageInput"
                    class="reader-page-input"
                    type="number"
                    min="1"
                    value="1"
                    aria-label="Current page"
                >

                <span>
                    /
                </span>

                <span
                    id="totalPages"
                    class="reader-total-pages"
                >
                    0
                </span>

            </div>


            <button
                id="nextPage"
                type="button"
            >
                Next Page →
            </button>

        </nav>


        <!-- =================================================
             ZOOM
        ================================================== -->

        <div
            id="readerZoomControls"
            class="reader-zoom-controls"
        >

            <button
                id="zoomOut"
                type="button"
                aria-label="Zoom out"
            >
                −
            </button>


            <span
                id="zoomValue"
                class="reader-zoom-value"
            >
                100%
            </span>


            <button
                id="zoomIn"
                type="button"
                aria-label="Zoom in"
            >
                +
            </button>

        </div>


        <!-- =================================================
             WATERMARK
        ================================================== -->

        <div
            id="readerWatermark"
            class="reader-watermark-reader"
            aria-hidden="true"
        >
            Chishti Reader
        </div>

    </main>
        <!-- =================================================
             PDF LOADING AREA
        ================================================== -->

        <div
            id="readerLoading"
            class="reader-loading"
            aria-live="polite"
            hidden
        >

            <div
                class="reader-loading-text"
            >
                Loading book...
            </div>

        </div>


        <!-- =================================================
             PDF ERROR AREA
        ================================================== -->

        <div
            id="readerError"
            class="reader-error-state"
            aria-live="assertive"
            hidden
        >

            <div
                id="readerErrorMessage"
            >
                Unable to load this book.
            </div>

            <button
                id="readerRetry"
                type="button"
            >
                Try Again
            </button>

        </div>


        <!-- =================================================
             PDF CANVAS CONTAINER
        ================================================== -->

        <div
            id="readerCanvasContainer"
            class="reader-canvas-container"
        >

            <!--
                PDF.js canvas elements will be created here.
                JavaScript will render each PDF page into
                this container.
            -->

        </div>


        <!-- =================================================
             BOOK INFORMATION
        ================================================== -->

        <div
            id="readerBookTitle"
            class="reader-book-title"
            aria-live="polite"
        >
        </div>


        <!-- =================================================
             READER STATUS
        ================================================== -->

        <div
            id="readerStatus"
            class="reader-status"
            aria-live="polite"
        >
        </div>


        <!-- =================================================
             BASIC READER CONTROLS
        ================================================== -->

        <div
            id="readerControls"
            class="reader-controls"
        >

            <button
                id="readerResetZoom"
                type="button"
            >
                100%
            </button>

        </div>
        <!-- =================================================
             READER TOOLBAR
        ================================================== -->

        <div
            id="readerToolbar"
            class="reader-toolbar"
            role="toolbar"
            aria-label="Reader tools"
        >

            <button
                id="readerZoomOut"
                type="button"
                aria-label="Zoom out"
                title="Zoom out"
            >
                −
            </button>


            <span
                id="readerZoomDisplay"
                class="reader-zoom-value"
            >
                100%
            </span>


            <button
                id="readerZoomIn"
                type="button"
                aria-label="Zoom in"
                title="Zoom in"
            >
                +
            </button>

        </div>


        <!-- =================================================
             READER WATERMARK
        ================================================== -->

        <div
            id="readerPageWatermark"
            class="reader-page-watermark"
            aria-hidden="true"
        >
            Chishti Reader
        </div>


        <!-- =================================================
             CURRENT BOOK INFORMATION
        ================================================== -->

        <div
            id="readerBookInfo"
            class="reader-book-info"
        >

            <span
                id="readerBookName"
            ></span>

        </div>


        <!-- =================================================
             READER MESSAGE
        ================================================== -->

        <div
            id="readerMessage"
            class="reader-message"
            aria-live="polite"
            hidden
        >
        </div>


        <!-- =================================================
             END OF BASE READER CONTENT
        ================================================== -->
        <!-- =================================================
             READER FOOTER
        ================================================== -->

        <footer
            id="readerFooter"
            class="reader-footer"
        >

            <span
                id="readerFooterWatermark"
                class="reader-footer-watermark"
            >
                Chishti Reader
            </span>

        </footer>


    </main>
        <!-- =================================================
             READER FOOTER
        ================================================== -->

        <footer
            id="readerFooter"
            class="reader-footer"
        >

            <span
                class="reader-footer-watermark"
            >
                Chishti Reader
            </span>

        </footer>


    </main>


    <!-- =====================================================
         PDF.JS
         ===================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
        type="module"
    ></script>


    <!-- =====================================================
         CHISHTI READER JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="./reader.js"
    ></script>


</body>

</html>
