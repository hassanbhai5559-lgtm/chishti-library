<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Chishti Reader</title>

<meta name="theme-color"
content="#2b0000">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="reader.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

</head>

<body>

<!--==================================================
BACKGROUND
===================================================-->

<div class="reader-background">

    <div class="bg-gradient"></div>

    <div class="bg-light"></div>

</div>

<!--==================================================
MAIN READER
===================================================-->

<div class="reader">

<!--==================================================
TOP TOOLBAR
===================================================-->

<header class="reader-toolbar">

    <!-- LEFT -->

    <div class="toolbar-left">

        <button
        id="menuBtn"
        class="tool-btn">

            <i class="fas fa-bars"></i>

        </button>

        <div class="reader-logo">

            <img
            src="logo.png"
            alt="Chishti Library">

        </div>

        <div class="reader-title">

            <h2>

                CHISHTI READER

            </h2>

            <span>

                Premium Digital Library

            </span>

        </div>

    </div>

    <!-- CENTER -->

    <div class="toolbar-center">

        <div class="current-book">

            <i class="fas fa-book-open"></i>

            <span
            id="bookTitle">

                Loading Book...

            </span>

        </div>

    </div>

    <!-- RIGHT -->

    <div class="toolbar-right">

        <button
        id="bookmarkBtn"
        class="tool-btn">

            <i class="fas fa-bookmark"></i>

        </button>

        <button
        id="searchBtn"
        class="tool-btn">

            <i class="fas fa-search"></i>

        </button>

        <button
        id="themeBtn"
        class="tool-btn">

            <i class="fas fa-moon"></i>

        </button>

        <button
        id="settingsBtn"
        class="tool-btn">

            <i class="fas fa-gear"></i>

        </button>

    </div>

</header>

<!--==================================================
BOOK STAGE
===================================================-->

<main class="reader-stage">

    <div class="stage-light"></div>

    <div class="book-shadow"></div>

    <section class="book-container">

        <div id="book" class="book">

            <!--=========================
            LEFT PAGE
            =========================-->

            <div class="page left-page">

                <div class="page-paper">

                    <canvas
                    id="leftCanvas"></canvas>

                </div>

            </div>

            <!--=========================
            BOOK SPINE
            =========================-->

            <div class="book-spine">

                <div class="spine-highlight"></div>

                <div class="spine-shadow"></div>

            </div>

            <!--=========================
            RIGHT PAGE
            =========================-->

            <div class="page right-page">

                <div class="page-paper">

                    <canvas
                    id="rightCanvas"></canvas>

                </div>

            </div>

            <!--=========================
            PAGE GLOW
            =========================-->

            <div class="page-glow"></div>

        </div>

    </section>

</main>

 <!--==================================================
PREMIUM BOTTOM TOOLBAR
===================================================-->

<footer class="reader-bottom">

    <!-- LEFT -->

    <div class="bottom-left">

        <button
        id="firstPage"
        class="bottom-btn"
        title="First Page">

            <i class="fas fa-backward-fast"></i>

        </button>

        <button
        id="prevPage"
        class="bottom-btn"
        title="Previous">

            <i class="fas fa-chevron-left"></i>

        </button>

    </div>

    <!-- CENTER -->

    <div class="bottom-center">

        <div class="page-info">

            <span id="pageCounter">

                1 - 2

            </span>

            <span class="page-divider">

                /

            </span>

            <span id="totalPages">

                0

            </span>

        </div>

    </div>

    <!-- RIGHT -->

    <div class="bottom-right">

        <button
        id="zoomOut"
        class="bottom-btn"
        title="Zoom Out">

            <i class="fas fa-search-minus"></i>

        </button>

        <button
        id="zoomIn"
        class="bottom-btn"
        title="Zoom In">

            <i class="fas fa-search-plus"></i>

        </button>

        <button
        id="downloadBtn"
        class="bottom-btn"
        title="Download">

            <i class="fas fa-download"></i>

        </button>

        <button
        id="printBtn"
        class="bottom-btn"
        title="Print">

            <i class="fas fa-print"></i>

        </button>

        <button
        id="fullscreenBtn"
        class="bottom-btn"
        title="Fullscreen">

            <i class="fas fa-expand"></i>

        </button>

        <button
        id="nextPage"
        class="bottom-btn"
        title="Next">

            <i class="fas fa-chevron-right"></i>

        </button>

        <button
        id="lastPage"
        class="bottom-btn"
        title="Last Page">

            <i class="fas fa-forward-fast"></i>

        </button>

    </div>

</footer>

<!--==================================================
LEFT SIDEBAR
(Future)
===================================================-->

<aside id="readerSidebar" class="reader-sidebar">

    <div class="sidebar-header">

        <h3>CHISHTI LIBRARY</h3>

    </div>

    <div class="sidebar-content">

        <!-- Future -->

    </div>

</aside>

<!--==================================================
AI PANEL
(Future)
===================================================-->

<aside id="readerAI" class="reader-ai">

    <div class="ai-header">

        <i class="fas fa-robot"></i>

        <span>CHISHTI AI</span>

    </div>

    <div class="ai-content">

        <!-- Future AI -->

    </div>

</aside>

<!--==================================================
MODALS
===================================================-->

<div id="readerModal"></div>

<!--==================================================
OVERLAY
===================================================-->

<div id="overlay"></div>

</div>
<!-- reader END -->

<!--==================================================
JAVASCRIPT
===================================================-->

<script src="reader.js"></script>

</body>
</html>
